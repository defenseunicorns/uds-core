# Raw chart overlay: preserve the original Keycloak component contract explicitly.
devMode: true
nativeIdentity:
  enabled: true
  authenticationProfile: password-only
  coreAudiencePairsEnabled: true
  bridgeImage: uds-core-dev-identity:pairing-20261031-v1
  dexImage: uds-core-dev-dex:pairing-20261031-v1
  tlsSecret: uds-native-identity-tls
  controllerNamespace: uds-system
  controllerServiceAccount: uds-controller
realmAuthFlows:
  USERNAME_PASSWORD_AUTH_ENABLED: true
  OTP_ENABLED: false
  X509_AUTH_ENABLED: false
  SOCIAL_AUTH_ENABLED: false
  WEBAUTHN_ENABLED: false
  X509_MFA_ENABLED: false
realmInitEnv:
  FLEET_CLIENT_ENABLED: "true"
  GOOGLE_IDP_ENABLED: false
  EMAIL_VERIFICATION_ENABLED: false
  TERMS_AND_CONDITIONS_ENABLED: false
  PASSWORD_POLICY: ""
  SECURITY_HARDENING_ADDITIONAL_PROTOCOL_MAPPERS: ""
  SECURITY_HARDENING_ADDITIONAL_CLIENT_SCOPES: ""
insecureAdminPasswordGeneration:
  enabled: true
autoscaling:
  enabled: false
adminApiAllowedPrincipals:
  - cluster.local/ns/uds-system/sa/uds-controller
