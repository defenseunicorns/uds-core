# Connected deployments have no Zarf registry. Preserve the exact signed
# proxy image input instead of producing an invalid /istio/... image reference.
global:
  proxy:
    image: docker.io/istio/proxyv2:1.31.2-distroless
  proxy_init:
    image: docker.io/istio/proxyv2:1.31.2-distroless
