# This replaces the stock Pepr process recording template only in the explicitly
# native derived chart. Legacy metric names denote capability compatibility;
# implementation and alias labels make the replacement visible to consumers.
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: uds-pepr-uptime
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: uds-native-legacy-capability-aliases
      rules:
        - record: uds:pepr_admission:up
          labels:
            uds_layer: base
            uds_component: pepr-admission
            implementation: go-native
            compatibility_alias: "true"
            metric_semantics: admission-capability
          expr: max(uds:admission:up{implementation="go-native"}) or on() vector(0)
        - record: uds:pepr_watcher:up
          labels:
            uds_layer: base
            uds_component: pepr-watcher
            implementation: go-native
            compatibility_alias: "true"
            metric_semantics: reconciliation-capability
          expr: max(uds:reconciliation:up{implementation="go-native"}) or on() vector(0)
{{- end }}
