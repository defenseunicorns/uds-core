{{- $domain := tpl .Values.domain . }}
{{- $rootTLS := .Values.rootDomain.tls | default dict -}}
{{- $servers := .Values.tls.servers | default dict -}}
{{- $rootServerName := .Values.rootDomain.server | default "" -}}
{{- if and $rootServerName (not .Values.rootDomain.enabled) }}
  {{- fail "rootDomain.server requires rootDomain.enabled to be true" }}
{{- end }}
{{- if and $rootServerName (not (hasKey $servers $rootServerName)) }}
  {{- fail "rootDomain.server must name an existing tls.servers entry" }}
{{- end }}
{{- if and $rootServerName (not (empty $rootTLS)) }}
  {{- fail "rootDomain.tls cannot be configured when rootDomain.server is set" }}
{{- end }}
{{- if and $rootServerName (hasKey .Values.rootDomain "enableHttpsRedirect") }}
  {{- fail "rootDomain.enableHttpsRedirect cannot be configured when rootDomain.server is set" }}
{{- end }}
{{- $rootEnableHttpsRedirect := true -}}
{{- if hasKey .Values.rootDomain "enableHttpsRedirect" }}
  {{- $rootEnableHttpsRedirect = .Values.rootDomain.enableHttpsRedirect -}}
{{- end }}
{{- $rootMode := $rootTLS.mode | default ($.Values.tls.mode | default "SIMPLE") -}}
{{- $rootSupportTLS := $rootTLS.supportTLSV1_2 | default ($.Values.tls.supportTLSV1_2 | default false) -}}
{{- if .Values.tls }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.name }}-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.name }}-ingressgateway
  servers:
    {{ range $name,$server := $servers }}
    - hosts:
        {{- range $server.hosts | default (list "*") }}
        - "{{ . }}.{{ $domain }}"
        {{- end }}
        {{- if eq $rootServerName $name }}
        - "{{ $domain }}"
        {{- end }}
      port:
        name: "http-{{ $name }}"
        number: 80
        protocol: HTTP
      {{- if or (not (hasKey $server "enableHttpsRedirect")) $server.enableHttpsRedirect }}
      tls:
        httpsRedirect: true
      {{- end }}
    - hosts:
        {{- range $server.hosts | default (list "*") }}
        - "{{ . }}.{{ $domain }}"
        {{- end }}
        {{- if eq $rootServerName $name }}
        - "{{ $domain }}"
        {{- end }}
      port:
        name: "https-{{ $name }}"
        number: 443
        protocol: HTTPS
      tls:
        mode: {{ $server.mode }}
        {{- if ne $server.mode "PASSTHROUGH" }}
        {{ if and ($server.tls).cert (not ($server.tls).credentialName) }}
        credentialName: "{{ $name }}-tls"
        {{ else }}
        credentialName: {{ ($server.tls).credentialName | default $.Values.tls.credentialName | default "gateway-tls" | quote }}
        {{ end }}
        minProtocolVersion: {{ if $.Values.tls.supportTLSV1_2 }}TLSV1_2{{ else }}TLSV1_3{{ end }}
        {{- end }}
    {{ end }}
    {{- if and .Values.rootDomain.enabled (not $rootServerName) }}
    - hosts:
        - "{{ $domain }}"
      port:
        name: "http-root-domain"
        number: 80
        protocol: HTTP
      {{- if $rootEnableHttpsRedirect }}
      tls:
        httpsRedirect: true
      {{- end }}
    - hosts:
        - "{{ $domain }}"
      port:
        name: "https-root-domain"
        number: 443
        protocol: HTTPS
      tls:
        mode: {{ $rootMode | quote }}
        {{- if ne $rootMode "PASSTHROUGH" }}
        credentialName: {{ $rootTLS.credentialName | default "root-domain-tls" | quote }}
        minProtocolVersion: {{ if $rootSupportTLS }}TLSV1_2{{ else }}TLSV1_3{{ end }}
        {{- end }}
    {{- end }}
{{ end }}
