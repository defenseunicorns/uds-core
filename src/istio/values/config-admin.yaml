name: admin
# Explicit values take precedence, then package variables, then admin.<domain>.
domain: '{{default (default (printf "admin.%s" (default .Variables.DOMAIN .Values.global.domain)) .Variables.ADMIN_DOMAIN) .Values.global.adminDomain}}'
tls:
  servers:
    keycloak:
      mode: OPTIONAL_MUTUAL
      hosts:
        - "keycloak"
    admin:
      mode: SIMPLE
  cert: ""
  key: ""
  cacert: ""
