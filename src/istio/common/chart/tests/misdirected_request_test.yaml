# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: common Istio - misdirected request EnvoyFilter
templates:
  - templates/misdirected-request-envoyfilter.yaml

tests:
  - it: should render globally when enabled
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: misdirected-request
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: istio-system
        documentIndex: 0
      - notExists:
          path: spec.workloadSelector
        documentIndex: 0

  - it: should not render filters when disabled
    set:
      misdirectedRequest:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
