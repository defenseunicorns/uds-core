{{- $misdirectedRequest := .Values.misdirectedRequest }}
{{- if $misdirectedRequest.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: misdirected-request
  namespace: istio-system
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.lua
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
            inlineCode: |
              function envoy_on_request(request_handle)
                local server_name = request_handle:streamInfo():requestedServerName()
                local authority = request_handle:headers():get(":authority") or ""
                local is_routed = request_handle:filterContext():get("uds_route") == "true"
                if server_name ~= "" and not string.find(authority, server_name, 1, true) and not is_routed then
                  request_handle:respond({[":status"] = "421"}, "Misdirected Request")
                end
              end
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            route:
              action: ANY
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.lua:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              filter_context:
                uds_route: "true"
{{- end }}
