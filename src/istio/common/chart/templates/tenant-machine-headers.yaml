apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: tenant-machine-headers
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      app: tenant-ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_FIRST
        value:
          name: uds.tenant-machine-headers
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_request(handle)
                local headers = handle:headers()
                headers:remove("x-uds-machine-presenter")
                local token = headers:get("x-uds-machine-token")
                if headers:get("x-uds-authservice-token") ~= nil or
                   (token ~= nil and (headers:getNumValues("x-uds-machine-token") ~= 1 or
                    not token:match("^Bearer [%w_%-]+%.[%w_%-]+%.[%w_%-]+$"))) then
                  handle:respond({[":status"] = "401"}, "")
                end
              end
