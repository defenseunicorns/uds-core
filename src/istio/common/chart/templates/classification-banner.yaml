{{- $classificationBanners := include "uds-global-istio-config.classificationBanners" . | fromYamlArray }}
{{- if $classificationBanners }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: classification-banner
  namespace: istio-system
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.compressor
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
          response_direction_config:
            common_config:
              min_content_length: 100
              content_type:
                - text/html
            disable_on_etag_header: true
          request_direction_config:
            common_config:
              enabled:
                default_value: false
                runtime_key: request_compressor_enabled
          compressor_library:
            name: text_optimized
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
              memory_level: 3
              window_bits: 10
              compression_level: BEST_COMPRESSION
              compression_strategy: DEFAULT_STRATEGY
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value: # Lua script configuration
        name: envoy.lua
        typed_config:
          "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
          inlineCode: |-
            -- Setup colors, text and banner div(s)
            -- Color reference: https://www.astrouxds.com/components/classification-markings/
            local classColorMap = {
              UNCLASSIFIED = { backgroundColor = "#007a33", textColor = "#ffffff" },
              CUI = { backgroundColor = "#502b85", textColor = "#ffffff" },
              CONFIDENTIAL = { backgroundColor = "#0033a0", textColor = "#ffffff" },
              SECRET = { backgroundColor = "#c8102e", textColor = "#ffffff" },
              ["TOP SECRET"] = { backgroundColor = "#ff8c00", textColor = "#000000" },
              ["TOP SECRET//SCI"] = { backgroundColor = "#fce83a", textColor = "#000000" },
              UNKNOWN = { backgroundColor = "#000000", textColor = "#ffffff" },
              ["SAMPLE BANNER"] = { backgroundColor = "#000000", textColor = "#ffffff" },
            }
            local function trim(s)
              return (s:gsub("^%s*(.-)%s*$", "%1"))
            end

            local function classificationKey(text)
              local upper = string.upper(trim(text or ""))

              -- Split on // segments to avoid substring matches
              local segments = {}
              for segment in upper:gmatch("[^/]+") do
                table.insert(segments, trim(segment))
              end

              local base = segments[1] or ""
              local hasSCI = false
              for i = 2, #segments do
                if segments[i] == "SCI" then
                  hasSCI = true
                  break
                end
              end

              if string.find(base, "^TOP SECRET") then
                if hasSCI then
                  return "TOP SECRET//SCI"
                end
                return "TOP SECRET"
              elseif string.find(base, "^SECRET") then
                return "SECRET"
              elseif string.find(base, "^CONFIDENTIAL") then
                return "CONFIDENTIAL"
              elseif string.find(base, "^CUI") then
                return "CUI"
              elseif string.find(base, "^UNCLASSIFIED") then
                return "UNCLASSIFIED"
              elseif string.find(base, "^SAMPLE BANNER") then
                return "SAMPLE BANNER"
              else
                return "UNKNOWN"
              end
            end

            -- Enabled applications receive real rows for the banners and a constrained,
            -- scrollable middle row for the original page. This is CSS-only, so application CSP
            -- can continue to reject inline JavaScript without disabling the layout adjustment.
            local function viewportLayoutStyle(addFooter)
              local gridRows = "24px minmax(0, 1fr)"
              if addFooter then
                gridRows = gridRows .. " 24px"
              end

              return [[
            <style id="classification-banner-viewport-layout">
              html,
              body {
                height: 100%;
                margin: 0;
                overflow: hidden;
                width: 100%;
              }

              body {
                display: grid !important;
                height: auto !important;
                inset: 0 !important;
                min-height: 0 !important;
                position: fixed !important;
                width: auto !important;
                grid-template-rows: ]] .. gridRows .. [[;
                overflow: hidden !important;
                padding: 0 !important;
              }

              #classification-page-content {
                contain: layout paint;
                height: 100%;
                min-height: 0;
                min-width: 0;
                overflow-x: hidden;
                overflow-y: auto;
                position: relative;
              }
            </style>
            ]]
            end

            -- Banner match rules, injected via Helm
            local banner_rules = {
              {{- range $banner := $classificationBanners }}
              {
                hosts = {
                  {{- range $banner.enabledHosts }}
                  [{{ tpl . $ | quote }}] = true,
                  {{- end }}
                },
                pathPrefixes = {
                  {{- range ($banner.pathPrefixes | default (list)) }}
                  [{{ . | quote }}] = true,
                  {{- end }}
                },
                banner = {
                  classification = {{ $banner.text | default "UNKNOWN" | quote }},
                  addFooter = {{ if hasKey $banner "addFooter" }}{{ $banner.addFooter }}{{ else }}true{{ end }},
                },
              },
              {{- end }}
            }

            local function normalize_host(host)
              if not host then
                return ""
              end

              return (string.lower(host):gsub(":%d+$", ""))
            end

            local function findBanner(host, requestPath)
              local fallback = nil
              local bestMatch = nil
              local bestPrefixLength = -1

              for _, rule in ipairs(banner_rules) do
                if rule.hosts[host] then
                  if next(rule.pathPrefixes) == nil then
                    fallback = fallback or rule.banner
                  else
                    for prefix, _ in pairs(rule.pathPrefixes) do
                      local prefixLength = string.len(prefix)
                      if string.sub(requestPath, 1, prefixLength) == prefix and prefixLength > bestPrefixLength then
                        bestMatch = rule.banner
                        bestPrefixLength = prefixLength
                      end
                    end
                  end
                end
              end

              return bestMatch or fallback
            end

            local function buildPresentation(banner)
              local classification = banner.classification
              local colors = classColorMap[classificationKey(classification)] or classColorMap["UNKNOWN"]
              local style = "background-color: " .. colors.backgroundColor .. "; color: " .. colors.textColor .. "; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 400; height: 24px; line-height: 24px; border: 1px solid transparent; border-radius: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 100%; min-width: 0; max-width: 100vw; padding: 0 8px; position: relative; text-align: center; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; margin: 0; z-index: 2147483647;"

              return {
                addFooter = banner.addFooter,
                footer = "<div id=\"classification-banner-bottom\" style=\"" .. style .. "\">" .. classification .. "</div>",
                header = "<div id=\"classification-banner-top\" style=\"" .. style .. "\">" .. classification .. "</div>",
                viewportLayoutStyle = viewportLayoutStyle(banner.addFooter),
              }
            end

            -- Handle request: Extract matching inputs and store them as metadata
            function envoy_on_request(request_handle)
              local host = normalize_host(request_handle:headers():get(":authority"))
              local requestPath = request_handle:headers():get(":path") or ""
              local pathWithoutQuery = string.match(requestPath, "^[^?]*") or requestPath
              local metadata = request_handle:streamInfo():dynamicMetadata()
              metadata:set("envoy.lua", "host", host)
              metadata:set("envoy.lua", "path", pathWithoutQuery)
            end

            -- Rewrite one complete body or one streamed fragment. State prevents duplicate
            -- replacements when the response arrives in multiple chunks.
            local function inject_banner(html, state, presentation)
              local matches

              if not state.head then
                html, matches = html:gsub(
                  "<[Hh][Ee][Aa][Dd]([^>]*)>",
                  function(attributes)
                    return "<head" .. attributes .. ">" .. presentation.viewportLayoutStyle
                  end,
                  1
                )
                state.head = matches > 0
              end

              if not state.body then
                html, matches = html:gsub(
                  "<[Bb][Oo][Dd][Yy]([^>]*)>",
                  function(attributes)
                    return "<body" .. attributes .. ">" .. presentation.header ..
                      "<div id=\"classification-page-content\">"
                  end,
                  1
                )
                state.body = matches > 0
              end

              if not state.closing then
                html, matches = html:gsub(
                  "</[Bb][Oo][Dd][Yy]%s*>",
                  function()
                    if presentation.addFooter then
                      return "</div>" .. presentation.footer .. "</body>"
                    end
                    return "</div></body>"
                  end,
                  1
                )
                state.closing = matches > 0
              end

              return html
            end

            -- Inject the most specific banner configured for the request host and path
            function envoy_on_response(response_handle)
              local content_type = response_handle:headers():get("Content-Type") or ""
              -- dynamicMetadata():get("envoy.lua") is nil when envoy_on_request did not run for
              -- this response (e.g. a locally generated reply), so guard before indexing "host".
              local lua_meta = response_handle:streamInfo():dynamicMetadata():get("envoy.lua")
              local banner = lua_meta and findBanner(lua_meta["host"], lua_meta["path"] or "")

              -- Skip anything that is not a successful HTML page with a matching banner (e.g. bodyless
              -- 3xx redirects, which still carry Content-Type: text/html).
              if response_handle:headers():get(":status") ~= "200"
                or not string.find(content_type, "text/html")
                or not banner then
                return
              end

              local presentation = buildPresentation(banner)

              -- response_handle:body() buffers the whole body and blocks until end-of-stream.
              -- That is fine for a bounded response (Content-Length present), but it hangs the
              -- gateway on a streamed/chunked response with no Content-Length (e.g. an SPA that
              -- renders its HTML directly to the response). Pick the strategy accordingly.
              if response_handle:headers():get("content-length") ~= nil then
                -- Bounded response: buffer and rewrite in one shot.
                local body = response_handle:body()
                local state = { head = false, body = false, closing = false }
                local body_text = tostring(body:getBytes(0, body:length()))
                body:setBytes(inject_banner(body_text, state, presentation))

                -- body() yields while Envoy buffers the response. Reacquire the header map before
                -- removing validators that describe the unmodified representation.
                local updated_headers = response_handle:headers()
                updated_headers:remove("content-length")
                updated_headers:remove("etag")
                updated_headers:remove("last-modified")
                updated_headers:replace("cache-control", "no-store")
              else
                -- Streamed response: rewrite chunks as they pass through (bodyChunks does not
                -- buffer), so we never wait for end-of-stream. Chunk boundaries are arbitrary, so
                -- a <head>/<body> tag can straddle two chunks. Carry any unterminated trailing tag
                -- ("<" with no closing ">") into the next chunk so the match is never missed.
                -- Headers must be changed before bodyChunks() yields the first chunk downstream.
                local updated_headers = response_handle:headers()
                updated_headers:remove("etag")
                updated_headers:remove("last-modified")
                updated_headers:replace("cache-control", "no-store")

                local state = { head = false, body = false, closing = false }
                local pending = ""
                for chunk in response_handle:bodyChunks() do
                  local len = chunk:length()
                  if len == 0 then
                    if pending ~= "" then
                      chunk:setBytes(pending)
                      pending = ""
                    end
                  else
                    local data = pending .. tostring(chunk:getBytes(0, len))
                    data = inject_banner(data, state, presentation)

                    -- Hold only an unterminated trailing tag for the next chunk. This covers the
                    -- <head>, <body>, and </body> tags without buffering the response.
                    local lt = string.find(data, "<[^>]*$")
                    if lt then
                      chunk:setBytes(string.sub(data, 1, lt - 1))
                      pending = string.sub(data, lt)
                    else
                      chunk:setBytes(data)
                      pending = ""
                    end
                  end
                end
              end
            end
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
            subFilter:
              name: "envoy.filters.http.router"
    patch:
      operation: INSERT_BEFORE
      value: # Lua script configuration 
        name: envoy.filters.http.decompressor
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.decompressor.v3.Decompressor
          decompressor_library:
            name: small
            typed_config:
              "@type": "type.googleapis.com/envoy.extensions.compression.gzip.decompressor.v3.Gzip"
              chunk_size: 65536
          request_direction_config:
            common_config:
              enabled:
                default_value: false
                runtime_key: request_decompressor_enabled
{{- end }}
