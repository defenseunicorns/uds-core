kind: ZarfPackageConfig
metadata:
  name: uds-core-istio-common
  description: "UDS Core Istio Common"
  url: https://istio.io/latest/
variables:
  - name: CNI_CONF_DIR
    description: "CNI configuration directory"
    default: ""
  - name: CNI_BIN_DIR
    description: "CNI binary directory"
    default: ""

components:
  - name: istio-controlplane
    required: true
    charts:
      - name: base
        url: https://istio-release.storage.googleapis.com/charts
        version: 1.30.3
        namespace: istio-system
        # Istio's webhooks currently will cause SSA conflicts - https://github.com/istio/istio/issues/59487
        # This should be fixed in a future Istio version
        serverSideApply: "false"
        values:
          - sourcePath: .istio-controlplane.base
            targetPath: .
            excludePaths:
              - .istio-controlplane.base._internal_defaults_do_not_set
              - .istio-controlplane.base.global.hub
              - .istio-controlplane.base.global.tag
      - name: istiod
        url: https://istio-release.storage.googleapis.com/charts
        version: 1.30.3
        namespace: istio-system
        valuesFiles:
          - "../values/base-istiod.yaml"
        # Istio's webhooks currently will cause SSA conflicts - https://github.com/istio/istio/issues/59487
        # This should be fixed in a future Istio version
        serverSideApply: "false"
        variables:
          - name: PROXY_MEMORY_REQUEST
            description: "Memory requests for sidecars in cluster"
            path: "global.proxy.resources.requests.memory"
          - name: PROXY_CPU_REQUEST
            description: "CPU requests for sidecars in cluster"
            path: "global.proxy.resources.requests.cpu"
        values:
          - sourcePath: .istio-controlplane.istiod
            targetPath: .
            excludePaths:
              - .istio-controlplane.istiod._internal_defaults_do_not_set
              - .istio-controlplane.istiod.global.hub
              - .istio-controlplane.istiod.global.tag
              - .istio-controlplane.istiod.pilot.image
              - .istio-controlplane.istiod.global.proxy.image
              - .istio-controlplane.istiod.global.proxy_init.image
      - name: uds-global-istio-config
        namespace: istio-system
        version: 0.1.0
        localPath: chart
        templatedValuesFiles:
          - "chart/values.yaml"
        values:
          - sourcePath: .istio-controlplane.uds-global-istio-config
            targetPath: .
      - name: cni
        url: https://istio-release.storage.googleapis.com/charts
        version: 1.30.3
        namespace: istio-system
        valuesFiles:
          - "../values/base-cni.yaml"
        values:
          - sourcePath: .istio-controlplane.cni
            targetPath: .
            excludePaths:
              - .istio-controlplane.cni._internal_defaults_do_not_set
              - .istio-controlplane.cni.global.hub
              - .istio-controlplane.cni.global.tag
      - name: ztunnel
        url: https://istio-release.storage.googleapis.com/charts
        version: 1.30.3
        namespace: istio-system
        valuesFiles:
          - "../values/base-ztunnel.yaml"
        values:
          - sourcePath: .istio-controlplane.ztunnel
            targetPath: .
            excludePaths:
              - .istio-controlplane.ztunnel._internal_defaults_do_not_set
              - .istio-controlplane.ztunnel.global.hub
              - .istio-controlplane.ztunnel.global.tag
              - .istio-controlplane.ztunnel.image
    actions:
      onDeploy:
        before:
          - description: "Add helm ownership if necessary for clean helm upgrade"
            mute: true
            cmd: |
              ./zarf tools kubectl annotate exemption istio -n uds-policy-exemptions "meta.helm.sh/release-name=uds-global-istio-config" --overwrite || true
          - description: "Ensure CNI_CONF_DIR is set"
            cmd: |
              if [ \"${ZARF_VAR_CNI_CONF_DIR}\" = \"\" ]; then
                if ./zarf tools kubectl version -o json 2>/dev/null | ./zarf tools yq '.serverVersion.gitVersion' 2>/dev/null | grep -q "k3s"; then
                  echo "/var/lib/rancher/k3s/agent/etc/cni/net.d"
                else
                  echo "/etc/cni/net.d"
                fi
              else
                echo "${ZARF_VAR_CNI_CONF_DIR}"
              fi
            setVariables:
              - name: CNI_CONF_DIR
          - description: "Ensure CNI_BIN_DIR is set"
            cmd: |
              if [ \"${ZARF_VAR_CNI_BIN_DIR}\" = \"\" ]; then
                if ./zarf tools kubectl version -o json 2>/dev/null | ./zarf tools yq '.serverVersion.gitVersion' 2>/dev/null | grep -q "k3s"; then
                  # Note: this was previously the k3d bin dir, but with k3s 1.31.7 it has changed to the default k3s dir
                  # if ./zarf tools kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -q "k3d"; then
                  #   echo "/bin/"
                  echo "/var/lib/rancher/k3s/data/cni"
                else
                  echo "/opt/cni/bin"
                fi
              else
                echo "${ZARF_VAR_CNI_BIN_DIR}"
              fi
            setVariables:
              - name: CNI_BIN_DIR
        after:
          - description: "Ensure Istio Ambient is enabled for Pepr"
            cmd: |
              # This is a duplicate of the action in src/pepr/zarf.yaml, just to ensure the labels are still correct after Istio installs
              echo "Setting Ambient mode for pepr-system..."
              ./zarf tools kubectl label namespace pepr-system "istio.io/dataplane-mode"="ambient" --overwrite

              echo "Disabling istio-injection on pepr-system..."
              ./zarf tools kubectl label namespace pepr-system istio-injection=disabled --overwrite

          - description: "Verify Pepr ambient readiness before gateway deployment"
            maxTotalSeconds: 180
            cmd: |
              set -eu

              service_name="pepr-uds-core"
              namespace="pepr-system"
              pod_selector="app=pepr-uds-core,pepr.dev/controller=admission"
              enrollment_ready=false
              enrollment_failure=""
              dry_run_output=""

              for attempt in $(seq 1 90); do
                endpoint_pods=$(./zarf tools kubectl get endpointslice \
                  -n "${namespace}" \
                  -l "kubernetes.io/service-name=${service_name}" \
                  -o json 2>/dev/null \
                  | ./zarf tools yq -r '
                    .items[].endpoints[]
                    | select(.conditions.ready == true)
                    | select((.conditions.serving // true) == true)
                    | select((.conditions.terminating // false) == false)
                    | (.targetRef.name // "__missing_target_ref__")' 2>/dev/null || true)

                enrollment_failure="no ready Pepr admission endpoints"
                if [ -n "${endpoint_pods}" ]; then
                  pod_count=0
                  ready_pod_count=0
                  pod_counts=$(./zarf tools kubectl get pod \
                    -n "${namespace}" \
                    ${endpoint_pods} \
                    -o json 2>/dev/null \
                    | ./zarf tools yq -r '
                      [.items | length,
                        ([.items[]
                          | select(.metadata.annotations["ambient.istio.io/redirection"] == "enabled")
                          | select(([(.status.conditions // [])[] | select(.type == "Ready" and .status == "True")] | length) > 0)] | length)] | @tsv' 2>/dev/null || true)
                  if [ -n "${pod_counts}" ]; then
                    pod_count=$(printf '%s' "${pod_counts}" | cut -f1)
                    ready_pod_count=$(printf '%s' "${pod_counts}" | cut -f2)
                  fi

                  if [ "${pod_count}" -gt 0 ] && [ "${pod_count}" -eq "${ready_pod_count}" ]; then
                    ./zarf tools kubectl create namespace istio-admin-gateway --dry-run=client -o yaml \
                      | ./zarf tools kubectl apply -f - >/dev/null

                    if dry_run_output=$(./zarf tools kubectl apply --server-side --dry-run=server -f - -o yaml 2>&1 <<'EOF'
              apiVersion: v1
              kind: Service
              metadata:
                name: admin-ingressgateway
                namespace: istio-admin-gateway
              spec:
                type: LoadBalancer
                ports:
                  - name: status-port
                    port: 15021
                    targetPort: 15021
                  - name: http2
                    port: 80
                    targetPort: 80
                  - name: https
                    port: 443
                    targetPort: 443
                selector:
                  app: admin-ingressgateway
                  istio: admin-ingressgateway
              EOF
                    ); then
                      echo "Pepr admission path accepted the admin gateway Service dry-run."
                      enrollment_ready=true
                      break
                    fi
                    enrollment_failure="admin gateway Service dry-run failed"
                  else
                    enrollment_failure="Pepr admission Pods are not Ready and ambient-enrolled"
                  fi
                fi

                echo "Pepr readiness is not complete; ${enrollment_failure} (attempt ${attempt}/90)."
                sleep 1
              done

              if [ "${enrollment_ready}" != true ]; then
                echo "Pepr admission path did not become ready in time." >&2
                if [ -n "${dry_run_output}" ]; then
                  printf '%s\n' "${dry_run_output}" >&2
                fi
                ./zarf tools kubectl get pods -n "${namespace}" -l "${pod_selector}" -o wide >&2 || true
                ./zarf tools kubectl get svc,endpoints,endpointslices -n "${namespace}" -l "kubernetes.io/service-name=${service_name}" -o wide >&2 || true
                exit 1
              fi

  - name: gateway-api-crds
    required: true
    manifests:
      - name: gateway-api-crds
        files:
          - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml
