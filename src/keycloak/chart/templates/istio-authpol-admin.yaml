{{- if .Capabilities.APIVersions.Has "security.istio.io/v1" }}
{{- $adminApiAllowedPrincipals := concat (list "cluster.local/ns/uds-fleet-command/sa/uds-fleet-command-sa") (.Values.adminApiAllowedPrincipals | default list) }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak-block-admin-access-from-public-gateway
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - kind: Gateway
      group: gateway.networking.k8s.io
      name: {{ include "keycloak.fullname" . }}-waypoint
  action: DENY
  rules:
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/admin*"
      from:
        - source:
            notNamespaces:
              - istio-admin-gateway
              - "pepr-system"
              {{- if .Values.dedicatedRealmAdminConsole.enabled }}
              - istio-tenant-gateway
              {{- end }}
            notPrincipals:
              {{- range $adminApiAllowedPrincipals }}
              - {{ . | quote }}
              {{- end }}
    # Keep master realm access limited to the admin gateway and allowlisted principals.
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/realms/master*"
      from:
        - source:
            notNamespaces:
              - istio-admin-gateway
              - "pepr-system"
            notPrincipals:
              {{- range $adminApiAllowedPrincipals }}
              - {{ . | quote }}
              {{- end }}
    {{- if .Values.dedicatedRealmAdminConsole.enabled }}
    # The tenant gateway can only serve the configured realm admin console, its Admin REST API, and server info.
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/admin*"
            notPaths:
              - "/admin/{{ .Values.realm }}/console"
              - "/admin/{{ .Values.realm }}/console/*"
              - "/admin/realms/{{ .Values.realm }}"
              - "/admin/realms/{{ .Values.realm }}/*"
              - "/admin/serverinfo"
      from:
        - source:
            namespaces:
              - istio-tenant-gateway
    # The tenant gateway must use its dedicated Keycloak host for every admin path.
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/admin*"
            notHosts:
              - "keycloak.{{ .Values.domain }}"
      from:
        - source:
            namespaces:
              - istio-tenant-gateway
    {{- end }}
    - to:
        - operation:
            ports:
              - "9000"
            paths:
            - /metrics*
      from:
        - source:
            notNamespaces:
            - monitoring
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              # Block client registration API access. Users can use Admin API via admin gateway instead.
              - "/realms/{{ .Values.realm }}/clients-registrations/*"
    # Scope the Fleet SA to ONLY the realm's clients endpoints; deny it everywhere else under the admin API.
    - to:
        - operation:
            ports:
              - "8080"
            paths:
              - "/admin*"
              - "/realms/master*"
            notPaths:
              - "/admin/realms/{{ .Values.realm }}/clients"
              - "/admin/realms/{{ .Values.realm }}/clients/*"
      from:
        - source:
            principals:
              - "cluster.local/ns/uds-fleet-command/sa/uds-fleet-command-sa"
    - when:
        - key: request.headers[istio-mtls-client-certificate]
          values: ["*"]
      to:
        - operation:
            ports:
              - "8080"
      from:
        - source:
            notNamespaces:
            - istio-tenant-gateway
            - istio-admin-gateway
            {{- range .Values.additionalGatewayNamespaces }}
            {{- if not (hasPrefix "istio-" .) }}
              {{- fail (printf "Allowed gateway namespace '%s' must start with 'istio-'" .) }}
            {{- end }}
            - {{ . }}
            {{- end }}
{{- end }}
