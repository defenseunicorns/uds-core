{{- if .Values.pathParameterProtection }}
# Block use of `;` path parameters in non-final path segments
# This prevents bypass of path-based authorization policies
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: block-path-parameters-in-non-final-segments
  namespace: istio-system
spec:
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              function envoy_on_request(request_handle)
                local path = request_handle:headers():get(":path")
                local host = request_handle:headers():get(":authority")

                {{- $domain := .Values.domain }}
                {{- $adminDomain := .Values.adminDomain | default (printf "admin.%s" $domain) }}

                -- Include Core's primary hosts and the alternate-host regression fixture.
                -- Operators can list any additional Keycloak hostnames in chart values.
                local keycloak_hosts = {
                  "sso.{{ $domain }}",
                  "sso-alt.{{ $domain }}",
                  "keycloak.{{ $adminDomain }}",
                  {{- range .Values.pathParameterProtectionAdditionalHosts }}
                  {{ . | quote }},
                  {{- end }}
                }
                local is_keycloak_host = false
                for _, keycloak_host in ipairs(keycloak_hosts) do
                  if host == keycloak_host then
                    is_keycloak_host = true
                    break
                  end
                end

                if is_keycloak_host then
                  if path then
                    local invalid_semicolon = string.match(path, "^[^;]*;[^/]*/")
                    if invalid_semicolon then
                      request_handle:respond(
                        { [":status"] = "400" },
                        "Path parameters may only appear after the final path segment"
                      )
                    end
                  end
                end
              end
{{- end }}
