# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json

suite: Keycloak adminDomain fallback
templates:
  - statefulset.yaml
  - path-parameter-envoyfilter.yaml
  - secret-kc-realm.yaml
  - secret-postgresql.yaml

tests:
  - it: should derive adminDomain from domain when adminDomain is unset
    set:
      domain: "custom.example.com"
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UDS_ADMIN_DOMAIN
            value: "admin.custom.example.com"

  - it: should use explicit adminDomain when set
    set:
      domain: "custom.example.com"
      adminDomain: "mgmt.example.com"
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: UDS_ADMIN_DOMAIN
            value: "mgmt.example.com"

  - it: should configure public and admin hostnames
    set:
      devMode: false
      domain: "custom.example.com"
      adminDomain: "mgmt.example.com"
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname=https://sso.custom.example.com"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-admin=https://keycloak.mgmt.example.com"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-backchannel-dynamic=false"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-strict=false"

  - it: should derive adminDomain in envoyfilter when adminDomain is unset
    set:
      domain: "custom.example.com"
      adminDomain: ""
      pathParameterProtection: true
    template: path-parameter-envoyfilter.yaml
    asserts:
      - matchRegex:
          path: spec.configPatches[0].patch.value.typed_config.inlineCode
          pattern: 'keycloak\.admin\.custom\.example\.com'

  - it: should derive admin hostname from domain when adminDomain is unset
    set:
      devMode: false
      domain: "custom.example.com"
      adminDomain: ""
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname=https://sso.custom.example.com"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-admin=https://keycloak.admin.custom.example.com"

  - it: should keep hostname resolution dynamic in devMode
    set:
      devMode: true
      domain: "custom.example.com"
      adminDomain: "mgmt.example.com"
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-strict=false"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--hostname=https://sso.custom.example.com"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-admin=https://keycloak.mgmt.example.com"
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-backchannel-dynamic=false"

  - it: should resolve templated domains and derive a templated empty adminDomain
    set:
      realm: "custom.example.com"
      domain: "{{ .Values.realm }}"
      adminDomain: '{{ "" }}'
      devMode: false
    template: statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname=https://sso.custom.example.com"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--hostname-admin=https://keycloak.admin.custom.example.com"
