# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json

suite: Keycloak - PodDisruptionBudget
templates:
  - poddisruptionbudget.yaml

tests:
  - it: should not render a PodDisruptionBudget outside HA mode
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render the default PodDisruptionBudget in HA mode
    set:
      autoscaling:
        enabled: true
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - notExists:
          path: spec.enabled

  - it: should render automatically when explicitly set to null in HA mode
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        enabled: null
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 1

  - it: should not render a PodDisruptionBudget when explicitly disabled
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        enabled: false
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should ignore a custom budget outside HA mode
    set:
      podDisruptionBudget:
        maxUnavailable: 2
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should ignore a budget matching the defaults outside HA mode
    set:
      podDisruptionBudget:
        maxUnavailable: 1
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should preserve a custom eviction policy in HA mode
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        unhealthyPodEvictionPolicy: IfHealthyBudget
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: IfHealthyBudget

  - it: should ignore enabled true outside HA mode
    set:
      podDisruptionBudget:
        enabled: true
    template: poddisruptionbudget.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should ignore enabled false outside HA mode
    set:
      podDisruptionBudget:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow a percentage maxUnavailable
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        maxUnavailable: "25%"
    template: poddisruptionbudget.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: "25%"

  - it: should allow minAvailable when the default maxUnavailable is cleared
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        minAvailable: 1
        maxUnavailable: null
    template: poddisruptionbudget.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: should fail when minAvailable and maxUnavailable are set
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        minAvailable: 1
        maxUnavailable: 2
    template: poddisruptionbudget.yaml
    asserts:
      - failedTemplate:
          errorMessage: "Cannot set both 'podDisruptionBudget.minAvailable' and 'podDisruptionBudget.maxUnavailable'."

  - it: should fail when minAvailable conflicts with the default maxUnavailable
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        minAvailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "Cannot set both 'podDisruptionBudget.minAvailable' and 'podDisruptionBudget.maxUnavailable'."

  - it: should reject conflicting zero budgets even when disabled in HA mode
    set:
      autoscaling:
        enabled: true
      podDisruptionBudget:
        enabled: false
        minAvailable: 0
        maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorMessage: "Cannot set both 'podDisruptionBudget.minAvailable' and 'podDisruptionBudget.maxUnavailable'."

  - it: should reject conflicting budgets outside HA mode
    set:
      podDisruptionBudget:
        minAvailable: 1
        maxUnavailable: 2
    asserts:
      - failedTemplate:
          errorMessage: "Cannot set both 'podDisruptionBudget.minAvailable' and 'podDisruptionBudget.maxUnavailable'."
