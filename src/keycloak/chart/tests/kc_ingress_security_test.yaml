suite: Keycloak ingress security
templates:
  - uds-package.yaml

tests:
  - it: sanitizes forwarded request metadata and sets trusted HTTPS headers and HSTS on every route
    asserts:
      - equal:
          path: spec.network.expose[*].advancedHTTP.headers.response.add.Vary
          value: Origin
      - equal:
          path: spec.network.expose[0].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[1].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[2].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[*].advancedHTTP.headers.response.add.strict-transport-security
          value: "max-age=31536000; includeSubDomains"
      - contains:
          path: spec.network.expose[0].advancedHTTP.headers.response.remove
          content: strict-transport-security
      - contains:
          path: spec.network.expose[1].advancedHTTP.headers.response.remove
          content: strict-transport-security
      - contains:
          path: spec.network.expose[2].advancedHTTP.headers.response.remove
          content: strict-transport-security
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: Forwarded
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-For
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Host
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Proto
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Port
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Prefix
      - notContains:
          path: spec.network.expose
          any: true
          content:
            gateway: passthrough
  - it: sanitizes forwarded request metadata and sets trusted HTTPS headers and HSTS with custom domains and third-party TLS
    set:
      domain: example.com
      adminDomain: ops.example.com
      thirdPartyIntegration.tls.tlsCertificateHeader: x-amzn-mtls-clientcert
    asserts:
      - equal:
          path: spec.network.expose[*].advancedHTTP.headers.response.add.Vary
          value: Origin
      - equal:
          path: spec.network.expose[0].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[1].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[2].advancedHTTP.headers.request.set
          value:
            X-Forwarded-For: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            X-Forwarded-Proto: https
            X-Forwarded-Port: "443"
      - equal:
          path: spec.network.expose[*].advancedHTTP.headers.response.add.strict-transport-security
          value: "max-age=31536000; includeSubDomains"
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: Forwarded
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-For
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Host
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Proto
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Port
      - contains:
          path: spec.network.expose[*].advancedHTTP.headers.request.remove
          content: X-Forwarded-Prefix
