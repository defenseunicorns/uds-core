kind: ZarfPackageConfig
metadata:
  name: uds-core-metrics-server
  description: "UDS Metrics Server"
  url: https://github.com/kubernetes-sigs/metrics-server

values:
  files:
    - zarf-values.yaml

components:
  - name: metrics-server
    required: false
    only:
      flavor: upstream
    import:
      path: common
    charts:
      - name: metrics-server
        valuesFiles:
          - "values/upstream-values.yaml"
    images:
      - registry.k8s.io/metrics-server/metrics-server:v0.9.0

  - name: metrics-server
    required: false
    only:
      flavor: registry1
    import:
      path: common
    charts:
      - name: metrics-server
        valuesFiles:
          - "values/registry1-values.yaml"
    images:
      - registry1.dso.mil/ironbank/opensource/kubernetes-sigs/metrics-server:v0.9.0

  - name: metrics-server
    required: false
    only:
      flavor: unicorn
    import:
      path: common
    charts:
      - name: metrics-server
        valuesFiles:
          - "values/unicorn-values.yaml"
    images:
      # v0.9.0 regressed Unicorn CI; pin the last CI-confirmed working image.
      - cgr.dev/defenseunicorns.com/metrics-server-fips@sha256:b0626a33fa03d83098ed1fe3c4df38748d559772d50bc6e7973c41e2a2d52dd4
