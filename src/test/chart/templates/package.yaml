apiVersion: uds.dev/v1alpha1
kind: Package
metadata:
  name: podinfo
  namespace: podinfo
spec:
  network:
    allow:
      # OAuth2 Proxy must reach Keycloak's public issuer endpoints for discovery and code exchange.
      - direction: Egress
        selector:
          app.kubernetes.io/name: alt-protected-oauth2-proxy
        remoteNamespace: istio-tenant-gateway
        remoteSelector:
          app: tenant-ingressgateway
        port: 443
        description: "Alternate-host OIDC provider"
      - direction: Egress
        selector:
          app.kubernetes.io/name: alt-protected-oauth2-proxy
        remoteNamespace: podinfo
        remoteSelector:
          app.kubernetes.io/component: alt-protected-upstream
        port: 9898
        description: "Protected test app upstream"
      - direction: Ingress
        selector:
          app.kubernetes.io/component: alt-protected-upstream
        remoteNamespace: podinfo
        remoteSelector:
          app.kubernetes.io/name: alt-protected-oauth2-proxy
        port: 9898
        description: "Protected test app upstream ingress"
    # Relying on default mesh mode
    # serviceMesh:
    #   mode: ambient
    expose:
      - service: podinfo
        selector:
          app.kubernetes.io/name: podinfo
        gateway: tenant
        host: podinfo
        port: 9898
      - service: alt-protected-oauth2-proxy
        selector:
          app.kubernetes.io/name: alt-protected-oauth2-proxy
        gateway: tenant
        host: alt-protected
        port: 4180
  monitor:
    - selector:
        app.kubernetes.io/name: podinfo
      targetPort: 9898
      portName: http
      description: "podmonitor"
      kind: PodMonitor
    - selector:
        app.kubernetes.io/name: podinfo
      targetPort: 9898
      portName: http
      description: "svcmonitor"
      kind: ServiceMonitor
  sso:
    - name: podinfo
      clientId: podinfo
      fullScopeAllowed: false
      redirectUris:
        - https://podinfo.{{ .Values.domain }}/login
      enableAuthserviceSelector:
        app.kubernetes.io/name: podinfo
    - name: alternate issuer regression client
      clientId: alt-podinfo-oidc
      secret: alt-issuer-regression-secret
      fullScopeAllowed: false
      redirectUris:
        - https://alt-protected.{{ .Values.domain }}/oauth2/callback
      protocolMappers:
        - name: alternate issuer audience
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: alt-podinfo-oidc
            access.token.claim: "true"
            introspection.token.claim: "true"
            id.token.claim: "false"
            lightweight.claim: "false"
            userinfo.token.claim: "false"
