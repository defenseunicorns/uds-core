apiVersion: apps/v1
kind: Deployment
metadata:
  name: alt-protected-podinfo
  namespace: podinfo
  labels:
    app.kubernetes.io/name: alt-protected-podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: alt-protected-upstream
  template:
    metadata:
      labels:
        app.kubernetes.io/component: alt-protected-upstream
        app.kubernetes.io/name: alt-protected-podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: alt-protected-podinfo
  namespace: podinfo
spec:
  selector:
    app.kubernetes.io/component: alt-protected-upstream
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: v1
kind: Secret
metadata:
  name: alt-protected-oauth2-proxy
  namespace: podinfo
type: Opaque
stringData:
  # Test-only client credential for the matching UDS test-package OIDC client.
  client-secret: alt-issuer-regression-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alt-protected-oauth2-proxy
  namespace: podinfo
  labels:
    app.kubernetes.io/name: alt-protected-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alt-protected-oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alt-protected-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://sso-alt.{{ .Values.domain }}/realms/uds
            - --client-id=alt-podinfo-oidc
            - --client-secret-file=/var/run/secrets/uds/client-secret
            - --redirect-url=https://alt-protected.{{ .Values.domain }}/oauth2/callback
            - --upstream=http://alt-protected-podinfo.podinfo.svc.cluster.local:9898/
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --cookie-secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
            - --cookie-name=__Host-alt-oauth2-proxy
            - --code-challenge-method=S256
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --reverse-proxy=true
            # The disposable CI cluster uses a test TLS certificate for its public Keycloak route.
            - --ssl-insecure-skip-verify=true
            - --skip-provider-button=true
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          volumeMounts:
            - name: client-secret
              mountPath: /var/run/secrets/uds
              readOnly: true
      volumes:
        - name: client-secret
          secret:
            secretName: alt-protected-oauth2-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: alt-protected-oauth2-proxy
  namespace: podinfo
spec:
  selector:
    app.kubernetes.io/name: alt-protected-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
