apiVersion: v1
kind: Namespace
metadata:
  name: vector-node-log-test
---
apiVersion: uds.dev/v1alpha1
kind: Exemption
metadata:
  name: vector-node-log-test
  namespace: uds-policy-exemptions
spec:
  exemptions:
    - policies:
        - RequireNonRootUser
        - RestrictHostPathWrite
        - RestrictVolumeTypes
      title: "Vector node log test writer"
      description: "Allows the test DaemonSet to write a controlled host log under /var/log so Vector node-log collection can be validated."
      matcher:
        namespace: vector-node-log-test
        name: "^vector-node-log-writer.*"
        kind: pod
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-node-log-writer
  namespace: vector-node-log-test
  labels:
    app.kubernetes.io/name: vector-node-log-writer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector-node-log-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector-node-log-writer
    spec:
      terminationGracePeriodSeconds: 5
      tolerations:
        - operator: Exists
      containers:
        - name: writer
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              LOG_FILE=/host/var/log/uds-core-vector-node-log-test.log
              cleanup() {
                rm -f "$LOG_FILE"
                exit 0
              }
              trap cleanup TERM INT
              touch "$LOG_FILE"
              test -w "$LOG_FILE"
              while true; do
                printf '%s\n' "uds-core-vector-node-log-test" >> "$LOG_FILE"
                sleep 2
              done
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsGroup: 0
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
