includes:
  - common-setup: https://raw.githubusercontent.com/defenseunicorns/uds-common/v1.32.2/tasks/lint.yaml

variables:
  - name: VELERO_CRD_VERSION
    # renovate: datasource=helm depName=velero versioning=helm registryUrl=https://vmware-tanzu.github.io/helm-charts
    default: "12.2.1"  # Helm chart version, not app version

tasks:
  - name: validate
    actions:
      - task: health-check
      - task: execute-backup

  - name: health-check
    actions:
      - description: Velero StatefulSet Health Check
        wait:
          cluster:
            kind: Deployment
            name: velero
            namespace: velero

  - name: execute-backup
    actions:
      - description: generates a unique backup name
        cmd: "echo \"velero-test-$(date +'%Y%m%d%H%M%S')\""
        mute: true
        setVariables:
          - name: BACKUP_NAME
      - description: "creates a velero backup object (equivalent of `velero backup create --from-schedule ...`)"
        cmd: |-
          uds zarf tools kubectl apply -f - <<-EOF
            apiVersion: velero.io/v1
            kind: Backup
            metadata:
              name: ${BACKUP_NAME}
              namespace: velero
            spec:
              storageLocation: default
              csiSnapshotTimeout: 0s
              excludedNamespaces:
              - kube-system
              - flux
              - velero
              hooks: {}
              includeClusterResources: true
              itemOperationTimeout: 0s
              metadata: {}
              snapshotVolumes: true
              ttl: 240h0m0s
          EOF
      - description: wait for the backup object
        wait:
          cluster:
            kind: backup.velero.io
            name: ${BACKUP_NAME}
            namespace: velero
      - description: check the status of the backup object
        cmd: |-
          debug_velero_backup() {
            # get backup object
            uds zarf tools kubectl get backup.velero.io -n velero ${BACKUP_NAME} -o yaml
            uds zarf tools kubectl get backup.velero.io -A -o yaml
            echo "::endgroup::"

            # get backupstoragelocations
            uds zarf tools kubectl get backupstoragelocation -A -o yaml

            # describe backup
            uds zarf tools kubectl describe backup -n velero ${BACKUP_NAME}

            # velero pod logs
            uds zarf tools kubectl logs -n velero -l name=velero
          }

          # Backups can take longer on upgrade runs because more data exists.
          # Poll for completion for a short, fixed budget, then dump diagnostics.
          START_TS=$(date +%s)
          TIMEOUT_SEC=90
          while true; do
            STATUS=$(uds zarf tools kubectl get backup.velero.io -n velero ${BACKUP_NAME} -o jsonpath='{.status.phase}')
            if [ "${STATUS}" = "Completed" ]; then
              break
            fi

            if [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "PartiallyFailed" ]; then
              echo "Status is '$STATUS'... backup failed"
              debug_velero_backup
              exit 1
            fi

            NOW_TS=$(date +%s)
            ELAPSED=$((NOW_TS - START_TS))
            if [ "$ELAPSED" -ge "$TIMEOUT_SEC" ]; then
              echo "Status is '$STATUS' after ${ELAPSED}s... timing out"
              debug_velero_backup
              exit 1
            fi

            echo "Status is '$STATUS'... waiting"
            sleep 5
          done

          echo "Checking Velero Volume Snapshot counts in the backup status..."
          SNAPSHOT_INFO=$(uds zarf tools kubectl describe backup.velero.io -n velero ${BACKUP_NAME})
          ATTEMPTED=$(echo "$SNAPSHOT_INFO" | grep 'Volume Snapshots Attempted:' | awk '{print $4}')
          COMPLETED=$(echo "$SNAPSHOT_INFO" | grep 'Volume Snapshots Completed:' | awk '{print $4}')

          echo "Velero Volume Snapshots Attempted: ${ATTEMPTED}"
          echo "Velero Volume Snapshots Completed: ${COMPLETED}"

          if [ "$ATTEMPTED" != "$COMPLETED" ]; then
            echo "Mismatch detected: Only ${COMPLETED} out of ${ATTEMPTED} Velero volume snapshots completed."
            debug_velero_backup
            exit 1
          fi
          echo "Status is Complete! Great success!"

  - name: e2e-test
    actions:
      - description: "Run Velero E2E tests"

  - name: update-crds
    description: "Update Velero CRDs from upstream"
    actions:
      - description: "Download Velero CRDs from upstream"
        shell:
          linux: bash
        cmd: |
          set -euo pipefail
          CHART_DIR="src/velero/chart/templates/crds"
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          # Consume the exact chart distributed by Core, without GitHub API listing.
          uds zarf tools helm pull velero --repo https://vmware-tanzu.github.io/helm-charts \
            --version "${VELERO_CRD_VERSION}" --destination "$workdir"
          tar -xzf "$workdir/velero-${VELERO_CRD_VERSION}.tgz" -C "$workdir" velero/crds
          mkdir -p "$CHART_DIR"
          for crd_file in "$workdir/velero/crds"/*.yaml; do
            if [ ! -f "$crd_file" ]; then
              echo "Pinned Velero chart contains no CRDs" >&2
              exit 1
            fi
            cp "$crd_file" "$CHART_DIR/$(basename "$crd_file")"
          done
          echo "Updated Velero CRDs from chart ${VELERO_CRD_VERSION}"
      - description: "Add License Headers to CRDs"
        task: common-setup:fix-license
