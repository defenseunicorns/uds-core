suite: Core configuration namespace
templates:
  - secret.yaml
  - uds-ca-certs.yaml
release:
  namespace: uds-system
tests:
  - it: installs every runtime configuration source beside the Core controller
    set:
      cluster:
        expose:
          domain: uds.dev
    asserts:
      - equal:
          path: metadata.namespace
          value: uds-system
