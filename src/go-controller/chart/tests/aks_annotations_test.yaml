suite: Retained AKS webhook compatibility
templates:
  - webhook.yaml
  - mutatingwebhook.yaml
  - mutating-webhook.yaml
release:
  namespace: uds-system
tests:
  - it: preserves the annotation on ClusterConfig validation
    template: webhook.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.annotations["admissions.enforcer/disabled"]
          value: "true"
  - it: preserves the annotation on workload validation
    template: webhook.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.annotations["admissions.enforcer/disabled"]
          value: "true"
  - it: preserves the annotation on resource validation
    template: webhook.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.annotations["admissions.enforcer/disabled"]
          value: "true"
  - it: preserves the annotation on workload mutation
    template: mutatingwebhook.yaml
    asserts:
      - equal:
          path: metadata.annotations["admissions.enforcer/disabled"]
          value: "true"
  - it: preserves the annotation on waypoint mutation
    template: mutating-webhook.yaml
    asserts:
      - equal:
          path: metadata.annotations["admissions.enforcer/disabled"]
          value: "true"
