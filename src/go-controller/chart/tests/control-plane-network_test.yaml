suite: Controller control-plane tunnel ingress
templates:
  - controller-network.yaml
release:
  namespace: uds-system
tests:
  - it: allows only the control-plane tunnel selector to reach admission
    documentIndex: 2
    asserts:
      - contains:
          path: spec.network.allow
          content:
            direction: Ingress
            selector:
              app: uds-controller
            remoteNamespace: kube-system
            remoteSelector:
              app: konnectivity-agent
            port: 9443
            description: Managed Kubernetes API server tunnel agents
