suite: Admission availability and resource bounds
templates:
  - deployment.yaml
  - pdb.yaml
release:
  namespace: uds-system
tests:
  - it: probes the listener without tying liveness to external trust
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /livez
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
  - it: prefers replicas on different nodes without blocking single-node installations
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
  - it: permits at most one voluntary disruption
    template: pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
