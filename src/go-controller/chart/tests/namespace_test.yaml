suite: Core controller deployment invariants
templates:
  - deployment.yaml
release:
  namespace: uds-system
tests:
  - it: preserves two admission replicas by default
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-node-critical
      - equal:
          path: spec.template.metadata.labels["istio.io/dataplane-mode"]
          value: ambient
  - it: rejects ambient opt-out for the admission control plane
    set:
      podLabels:
        istio.io/dataplane-mode: none
    asserts:
      - failedTemplate:
          errorMessage: Core controller Pods require ambient enrollment at creation; istio.io/dataplane-mode cannot be overridden.
  - it: preserves custom labels with the required mesh selection
    set:
      podLabels:
        istio.io/dataplane-mode: ambient
        probe: preserved
    asserts:
      - equal:
          path: spec.template.metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - equal:
          path: spec.template.metadata.labels.probe
          value: preserved
  - it: permits an explicit single-replica development override
    set:
      replicaCount: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
  - it: should use the protected recovery namespace
    asserts:
      - equal:
          path: metadata.namespace
          value: uds-system
  - it: should reject unsupported namespace customization
    release:
      namespace: other-system
    asserts:
      - failedTemplate:
          errorMessage: The native controller must be installed in uds-system; admission recovery and serving identities use this namespace.
  - it: uses the installer's registry address for Istio image validation
    set:
      zarfRegistryAddress: registry.example.test:5443
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZARF_REGISTRY_ADDRESS
            value: registry.example.test:5443
