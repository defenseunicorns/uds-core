{{- if not (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/MutatingAdmissionPolicy") }}
{{- fail "Core requires the admissionregistration.k8s.io/v1 MutatingAdmissionPolicy API (Kubernetes 1.36 or newer). Offline renders must declare this API explicitly." }}
{{- end }}
{{- $enabled := eq (include "uds.native.enabled" .) "true" }}
{{- $registered := eq (include "uds.admission.register" .) "true" }}
{{- $narrow := eq (include "uds.native.narrow" .) "true" }}
{{- if and $enabled (not $registered) }}
{{- fail "Native admission activation requires complete Go webhook registration" }}
{{- end }}
{{- if and $narrow (not $enabled) }}
{{- fail "nativeAdmission.narrowCallbacks requires qualified nativeAdmission.enabled policies and bindings" }}
{{- end }}
{{- range (.Files.Get "files/native-admission/policies.json" | fromJson).items }}
{{- if or $enabled (hasPrefix "uds-native-controller-" .metadata.name) }}
---
{{ toYaml . }}
{{- end }}
{{- end }}
{{- if $enabled }}
{{- if not (lookup "policy.uds.dev/v1alpha1" "AdmissionParameters" "uds-policy-exemptions" "uds-native-grants") }}
---
{{ .Files.Get "files/native-admission/empty-parameters.json" }}
{{- end }}
{{- end }}
