{{- if ne .Release.Namespace "uds-system" }}
{{- fail "The native controller must be installed in uds-system; admission recovery and serving identities use this namespace." }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: uds-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: uds-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uds-controller
  template:
    metadata:
      labels:
        app: uds-controller
    spec:
      serviceAccountName: uds-controller
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--kube-api-qps=%v" .Values.kubernetesAPI.qps | quote }}
            - {{ printf "--kube-api-burst=%v" .Values.kubernetesAPI.burst | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: UDS_CONTROLLER_MODE
              value: "native"
            - name: UDS_OPERATOR_NETWORK_POLICIES_ENABLED
              value: "false"
            - name: UDS_OPERATOR_AUTHORIZATION_POLICIES_ENABLED
              value: "false"
            - name: UDS_OPERATOR_ISTIO_INJECTION_ENABLED
              value: "false"
            - name: UDS_OPERATOR_ISTIO_INGRESS_ENABLED
              value: "false"
            - name: UDS_OPERATOR_ISTIO_EGRESS_ENABLED
              value: "false"
            - name: UDS_OPERATOR_SSO_ENABLED
              value: "false"
            - name: UDS_OPERATOR_POD_MONITORS_ENABLED
              value: "false"
            - name: UDS_OPERATOR_SERVICE_MONITORS_ENABLED
              value: "false"
            - name: UDS_OPERATOR_UPTIME_PROBES_ENABLED
              value: "false"
            - name: UDS_OPERATOR_CA_BUNDLE_ENABLED
              value: "false"
          volumeMounts:
            - name: keycloak-identity
              mountPath: /var/run/secrets/keycloak
              readOnly: true
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: keycloak-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: http://keycloak-http.keycloak.svc.cluster.local/realms/uds
                  expirationSeconds: 3600
