logLevel: info
zarfRegistryAddress: "127.0.0.1:31999"
replicaCount: 1
podLabels: {}

image:
  reference: ""
  repository: ghcr.io/defenseunicorns/uds-core/controller
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Reconciliation budget shared by typed, dynamic and UDS clients.
# Lease heartbeats have a separate fixed 1 QPS / 2 burst budget.
kubernetesAPI:
  qps: 20
  burst: 40

# Cold bootstrap may start the backend before registering its callbacks.
# Native activation requires registered complete Go callbacks.
admission:
  register: true

# Native policies require Kubernetes 1.36 or newer and the complete Go webhook.
# The compiler owns the protected grant union after the first empty bootstrap.
nativeAdmission:
  enabled: true
  # Core activates CEL first and routes only contextual/compatibility work to Go.
  # The internal bootstrap phase keeps both registrations disabled until ready.
  narrowCallbacks: true

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "1"
