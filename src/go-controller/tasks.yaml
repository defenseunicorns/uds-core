tasks:
  - name: gen-crds
    description: Generate Go API types from the current Core CRD schemas with stable naming.
    actions:
      - description: Regenerate API source from the Package and ClusterConfig schemas
        cmd: node src/go-controller/hack/generate-api.mjs

  - name: gen-clients
    description: "generate crd definition files, deepcopy and clients"
    actions:
      - description: "generate clients and deepcopy"
        cmd: src/go-controller/hack/update-codegen.sh

  - name: validate
    actions:
      - description: Wait for uds-controller pod(s) to be ready
        wait:
          cluster:
            kind: Deployment
            name: uds-controller
            namespace: uds-system

  - name: update-pepr
    description: Apply dev-flags.env to the Pepr watcher deployment and cycle the pod
    actions:
      - description: "Set feature flag env vars on the Pepr watcher and restart"
        cmd: |
          grep -v '^#' src/go-controller/dev-flags.env | grep -v '^[[:space:]]*$' | \
            xargs uds zarf tools kubectl set env deployment/pepr-uds-core-watcher -n pepr-system
          uds zarf tools kubectl rollout restart deployment/pepr-uds-core-watcher -n pepr-system
          uds zarf tools kubectl rollout status deployment/pepr-uds-core-watcher -n pepr-system

  - name: build-controller
    description: Build the standalone Go controller without changing identity or deploying a cluster
    actions:
      - cmd: |
          cd src/go-controller
          GOWORK=off CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o build/uds-controller .
