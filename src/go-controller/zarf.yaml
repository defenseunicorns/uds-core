    # x-release-please-end
    actions:
      onDeploy:
        after:
          - description: Verify the deployed CEL contract and actual API canaries
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" verify'
          - description: Retire only the replaced Core Pepr module
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" retire'
        onSuccess:
          - description: Remove Core helper files after verified retirement
            cmd:
              "case \"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:-}\" in\n  /*/core-transition/run) rm -rf -- \"${ZARF_VAR_UDS_CORE_TRANSITION_RUN%/run}\"\
              \ ;;\n  *) echo 'Unexpected Core helper path; refusing cleanup' >&2; exit 1 ;;\nesac\n"
        onFailure:
          - description: Explain forward recovery after a failed Core transition
            cmd:
              echo 'Core installation failed. Correct the reported error and rerun the package against the same cluster. After
              writer handoff, recovery continues with Go; do not restart the Pepr watcher.' >&2
