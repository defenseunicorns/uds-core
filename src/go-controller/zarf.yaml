              - .uds-controller.uds-controller.zarfRegistryAddress
              - .uds-controller.uds-controller.admission
              - .uds-controller.uds-controller.nativeAdmission
        variables:
          - name: UDS_LOG_LEVEL
            path: logLevel
        valuesFiles:
          - values/unicorn.yaml
    images:
      # x-release-please-start-version
      - ghcr.io/defenseunicorns/packages/private/uds/controller:1.16.0
    # x-release-please-end
    actions:
      onDeploy:
