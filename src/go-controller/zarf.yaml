kind: ZarfPackageConfig
metadata:
  name: uds-core-operator
  description: UDS Core controller and native Kubernetes admission
variables:
  - name: DOMAIN
    description: Cluster domain
    default: uds.dev
  - name: ADMIN_DOMAIN
    description: Domain for admin services, defaults to `admin.DOMAIN`
  - name: CA_BUNDLE_CERTS
    description:
      Base64 encoded CA certs (bundle) in PEM format that UDS Core will inherently trust. At a minimum this must
      at least include your Domain CA Cert if using Private PKI for your UDS Core Deployment
    default: ""
  - name: CA_BUNDLE_INCLUDE_DOD_CERTS
    description: Whether to include DoD root and intermediate certificates in the cluster CA bundle
    default: "false"
  - name: CA_BUNDLE_INCLUDE_PUBLIC_CERTS
    description: Whether to include public root and intermediate certificates in the cluster CA bundle
    default: "false"
  - name: UDS_LOG_LEVEL
    description: UDS Operator log level
    default: debug
  - name: AUTHSERVICE_REDIS_URI
    description: UDS Authservice Redis URI
    default: ""
  - name: ALLOW_ALL_NS_EXEMPTIONS
    description: Whether to allow exemptions to be created in all namespaces
    default: "false"
  - name: UDS_CORE_TRANSITION_RUN
    description: Internal path to the helper in Zarf's temporary package directory
    default: ""
  - name: UDS_CORE_TRANSITION_LINK_OWNED
    description: Internal ownership marker for the temporary helper discovery link
    default: "false"
values:
  files:
    - zarf-values.yaml
components:
  - name: uds-core-tools
    required: true
    actions:
      onDeploy:
        before:
          - description: Reset ownership of the temporary helper discovery link
            cmd: echo false
            setVariables:
              - name: UDS_CORE_TRANSITION_LINK_OWNED
          - description: Reserve an empty helper discovery directory without overwriting host files
            cmd: mkdir -m 700 .uds-core-transition && echo true
            setVariables:
              - name: UDS_CORE_TRANSITION_LINK_OWNED
        after:
          - description: Resolve the helper location managed by Zarf
            cmd: readlink .uds-core-transition/run
            setVariables:
              - name: UDS_CORE_TRANSITION_RUN
          - description: Remove the temporary helper discovery link
            cmd: rm .uds-core-transition/run && rmdir .uds-core-transition
          - description: Require native admission APIs before changing existing Core ownership
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" preflight'
        onFailure:
          - description: Clean the owned helper discovery link after a failed setup
            cmd:
              "if [ \"${ZARF_VAR_UDS_CORE_TRANSITION_LINK_OWNED:-false}\" = true ]; then\n  rm -f .uds-core-transition/run\n\
              \  if [ -d .uds-core-transition ]; then rmdir .uds-core-transition; fi\nfi\n"
          - description: Explain forward recovery after an interrupted installation
            cmd:
              echo 'Core installation failed. Correct the reported error and rerun the package against the same cluster. After
              writer handoff, recovery continues with Go; do not restart the Pepr watcher.' >&2
    files:
      # x-release-please-start-version
      - source: https://github.com/defenseunicorns/uds-core/releases/download/v1.16.0/core-transition-linux-amd64
        # x-release-please-end
        target: "###ZARF_TEMP###/core-transition/linux-amd64"
        executable: true
      # x-release-please-start-version
      - source: https://github.com/defenseunicorns/uds-core/releases/download/v1.16.0/core-transition-linux-arm64
        # x-release-please-end
        target: "###ZARF_TEMP###/core-transition/linux-arm64"
        executable: true
      # x-release-please-start-version
      - source: https://github.com/defenseunicorns/uds-core/releases/download/v1.16.0/core-transition-darwin-amd64
        # x-release-please-end
        target: "###ZARF_TEMP###/core-transition/darwin-amd64"
        executable: true
      # x-release-please-start-version
      - source: https://github.com/defenseunicorns/uds-core/releases/download/v1.16.0/core-transition-darwin-arm64
        # x-release-please-end
        target: "###ZARF_TEMP###/core-transition/darwin-arm64"
        executable: true
      - source: hack/run-transition.sh
        target: "###ZARF_TEMP###/core-transition/run"
        executable: true
        symlinks:
          - .uds-core-transition/run
      - source: native-admission/admission-contract.json
        target: "###ZARF_TEMP###/core-transition/admission-contract.json"
  - name: uds-operator-config
    required: true
    charts:
      - name: uds-operator-config
        namespace: uds-system
        version: 0.1.0
        localPath: assets/uds-operator-config
        templatedValuesFiles:
          - assets/uds-operator-config/values.yaml
        values:
          - sourcePath: .uds-operator-config.uds-operator-config
            targetPath: .
    actions:
      onDeploy:
        before:
          - description: Preserve existing ClusterConfig ownership during the Core namespace transition
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" api'
          - description: Create the mesh namespace before its bootstrap trust mount
            cmd:
              "./zarf tools kubectl create namespace istio-system --dry-run=client -o yaml | ./zarf tools kubectl apply -f
              -

              ./zarf tools kubectl create namespace monitoring --dry-run=client -o yaml | ./zarf tools kubectl apply -f -"
        onFailure:
          - description: Explain forward recovery after a failed Core transition
            cmd:
              echo 'Core installation failed. Correct the reported error and rerun the package against the same cluster. After
              writer handoff, recovery continues with Go; do not restart the Pepr watcher.' >&2
  - name: uds-exemptions
    required: true
    charts:
      - name: uds-exemptions
        namespace: uds-policy-exemptions
        version: 0.1.0
        localPath: assets/uds-exemptions
        valuesFiles:
          - assets/uds-exemptions/values.yaml
        values:
          - sourcePath: .uds-exemptions.uds-exemptions
            targetPath: .
    actions:
      onDeploy:
        onFailure:
          - description: Explain forward recovery after a failed Core transition
            cmd:
              echo 'Core installation failed. Correct the reported error and rerun the package against the same cluster. After
              writer handoff, recovery continues with Go; do not restart the Pepr watcher.' >&2
  - name: uds-controller-bootstrap
    required: true
    charts:
      - name: uds-controller
        releaseName: uds-controller
        namespace: uds-system
        version: 0.1.0
        localPath: chart
        templatedValuesFiles:
          - packaging-bootstrap.yaml
        values:
          - sourcePath: .uds-controller.uds-controller
            targetPath: .
            excludePaths:
              - .uds-controller.uds-controller.image
              - .uds-controller.uds-controller.zarfRegistryAddress
              - .uds-controller.uds-controller.admission
              - .uds-controller.uds-controller.nativeAdmission
        variables:
          - name: UDS_LOG_LEVEL
            path: logLevel
        valuesFiles:
          - values/upstream.yaml
    images:
      # x-release-please-start-version
      - ghcr.io/defenseunicorns/uds-core/controller:1.16.0
    # x-release-please-end
    actions:
      onDeploy:
        before:
          - description: Drain the previous Core writer before Go reconciliation starts
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" drain'
        after:
          - description: Wait for Core controller caches and serving identity
            maxTotalSeconds: 180
            cmd: ./zarf tools kubectl -n uds-system rollout status deployment/uds-controller --timeout=150s
          - description: Wait for Core networking and the compiler-owned admission snapshot
            maxTotalSeconds: 300
            cmd: '"${ZARF_VAR_UDS_CORE_TRANSITION_RUN:?}" snapshot'
        onFailure:
          - description: Explain forward recovery after a failed Core transition
            cmd:
              echo 'Core installation failed. Correct the reported error and rerun the package against the same cluster. After
              writer handoff, recovery continues with Go; do not restart the Pepr watcher.' >&2
    only:
      flavor: upstream
  - name: uds-controller-bootstrap
    required: true
    charts:
      - name: uds-controller
        releaseName: uds-controller
        namespace: uds-system
        version: 0.1.0
        localPath: chart
        templatedValuesFiles:
