# Each family follows one application release stream; sourceFiles lists all its pins.
# Patterns capture comparable app versions as (?<version>...) and retain original tags.
# Chart and auxiliary-image updates outside these identities keep their Renovate rules.
families:
  - name: istio
    sourceFiles:
      - src/istio/zarf.yaml
      - src/istio/tasks.yaml
      - src/pepr/tasks.yaml
    appDependency:
      datasource: github-tags
      packageName: istio/istio
      tagPattern: '^(?<version>\d+\.\d+\.\d+)$'

    flavors:
      upstream:
        images:
          - repository: docker.io/istio/pilot
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-distroless$'
          - repository: docker.io/istio/proxyv2
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-distroless$'
          - repository: docker.io/istio/install-cni
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-distroless$'
          - repository: docker.io/istio/ztunnel
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-distroless$'

      registry1:
        images:
          - repository: registry1.dso.mil/ironbank/tetrate/istio/pilot
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-fips$'
          - repository: registry1.dso.mil/ironbank/tetrate/istio/proxyv2
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-fips$'
          - repository: registry1.dso.mil/ironbank/tetrate/istio/install-cni
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-fips$'
          - repository: registry1.dso.mil/ironbank/tetrate/istio/ztunnel
            tagPattern: '^(?<version>\d+\.\d+\.\d+)-fips$'

      unicorn:
        images:
          - repository: cgr.dev/defenseunicorns.com/istio-pilot-fips
            tagPattern: '^v(?<version>\d+\.\d+\.\d+)$'
          - repository: cgr.dev/defenseunicorns.com/istio-proxy-fips
            tagPattern: '^v(?<version>\d+\.\d+\.\d+)$'
          - repository: cgr.dev/defenseunicorns.com/istio-install-cni-fips
            tagPattern: '^v(?<version>\d+\.\d+\.\d+)$'
          - repository: cgr.dev/defenseunicorns.com/ztunnel-fips
            tagPattern: '^v(?<version>\d+\.\d+\.\d+)$'

  - name: gateway-api
    sourceFiles: [src/istio/tasks.yaml]
    appDependency:
      datasource: github-tags
      packageName: kubernetes-sigs/gateway-api
      tagPattern: '^v(?<version>\d+\.\d+\.\d+)$'

    # Gateway API has an independent source release, not flavor images.
    flavors: {}

  - name: authservice
    sourceFiles: [src/authservice/zarf.yaml]
    appDependency:
      datasource: docker
      packageName: ghcr.io/istio-ecosystem/authservice/authservice
      tagPattern: '^(?<version>\d+\.\d+\.\d+)$'

    flavors:
      upstream:
        images:
