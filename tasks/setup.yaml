variables:
  - name: DEFAULT_K0S_VERSION
    description: "Exact K0s version for distribution testing"
    default: "v1.36.4+k0s.1"
  - name: K0S_DEV_STACK_VERSION
    description: "UDS dev stack source used for K0s tests"
    # renovate: datasource=github-tags depName=defenseunicorns/uds-k3d versioning=semver
    default: "v0.21.0"
  - name: DEFAULT_K3S_VERSION
    description: "Expected K3s version in the default airgap uds-k3d package"
    default: "v1.36.4+k3s1"

tasks:
  - name: k0s-test-cluster
    description: "Create a single-node K0s test cluster (Linux with Docker)"
    actions:
      - description: "Require KUBECONFIG to target the K0s test cluster"
        cmd: test "${KUBECONFIG}" = "$(pwd)/build/k0s/kubeconfig"
      - description: "Configure K0s DNS for UDS hostnames"
        cmd: |
          mkdir -p build/k0s
          cat > build/k0s/config.yaml <<'EOF'
          apiVersion: k0s.k0sproject.io/v1beta1
          kind: ClusterConfig
          metadata:
            name: uds
          spec:
            network:
              coreDNS:
                patches:
                  - target:
                      kind: ConfigMap
                      name: coredns
                      namespace: kube-system
                    patch:
                      type: MergePatch
                      content: |
                        data:
                          Corefile: |
                            .:53 {
                              errors
                              health
                              ready
                              rewrite stop name regex (.*\.admin\.uds\.dev) admin-ingressgateway.istio-admin-gateway.svc.cluster.local answer auto
                              rewrite stop name regex (.*\.uds\.dev) tenant-ingressgateway.istio-tenant-gateway.svc.cluster.local answer auto
                              kubernetes cluster.local in-addr.arpa ip6.arpa {
                                pods insecure
                                fallthrough in-addr.arpa ip6.arpa
                              }
                              prometheus :9153
                              forward . /etc/resolv.conf
                              cache 30
                              loop
                              reload
                              loadbalance
                            }
          EOF
      - description: "Start K0s"
        shell:
          linux: bash
        cmd: |
          set -euo pipefail
          K0S_IMAGE="docker.io/k0sproject/k0s:${DEFAULT_K0S_VERSION/+k0s./-k0s.}"
          docker run -d --name k0s-uds --hostname k0s-uds --privileged \
            --ulimit nofile=1048576:1048576 \
            --tmpfs /run -v /var/lib/k0s -v /var/log/pods -v /var/lib/kubelet \
            -v "$(pwd)/build/k0s/config.yaml:/etc/k0s/k0s.yaml:ro" \
            -p 127.0.0.1:6443:6443 "$K0S_IMAGE" \
            k0s controller --single --config=/etc/k0s/k0s.yaml \
            --disable-components=metrics-server --kubelet-root-dir=/var/lib/kubelet
          test "$(docker exec k0s-uds k0s version)" = "$DEFAULT_K0S_VERSION"
          # Istio CNI requires shared propagation for /var/run/netns.
          docker exec k0s-uds mount --make-rshared /run
      - description: "Get K0s kubeconfig"
        maxRetries: 30
        maxTotalSeconds: 180
        cmd: |
          set -e
          umask 077
          docker exec k0s-uds k0s kubeconfig admin > build/k0s/kubeconfig
          ./uds zarf tools yq -i '.clusters[].cluster.server = "https://127.0.0.1:6443"' build/k0s/kubeconfig
      - description: "Wait for K0s node"
        wait:
          cluster:
            kind: nodes
            name: k0s-uds
            condition: Ready
        maxTotalSeconds: 300
      - description: "Wait for K0s DNS"
        cmd: ./uds zarf tools kubectl rollout status deployment/coredns -n kube-system --timeout=300s
      - description: "Deploy the existing dev stack without creating K3d"
        shell:
          linux: bash
        cmd: |
          set -euo pipefail
          mkdir -p build/k0s/dev-stack
          curl -fsSL "https://github.com/defenseunicorns/uds-k3d/archive/refs/tags/${K0S_DEV_STACK_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C build/k0s/dev-stack
          ./uds zarf tools yq -i '.components = [.components[] | select(.name == "uds-dev-stack")]' build/k0s/dev-stack/zarf.yaml
          ./uds zarf package create build/k0s/dev-stack --confirm --skip-sbom --output build/k0s
          ./uds zarf package deploy build/k0s/zarf-package-uds-k3d-*.tar.zst --confirm
      - description: "Initialize K0s with Zarf"
        # renovate: datasource=github-tags depName=zarf-dev/zarf versioning=semver
        cmd: ./uds zarf package deploy oci://ghcr.io/zarf-dev/packages/init:v0.86.0 --confirm

  - name: create-k3d-cluster
    inputs:
      k3s_version:
        default: ""
        description: "Exact K3s version for connected uds-k3d deployments"
    actions:
      - description: "Create the K3d cluster"
        shell:
          darwin: bash
          linux: bash
        cmd: |
          set -euo pipefail
          if [ -z "${{ .inputs.k3s_version }}" ]; then
            ./uds zarf package deploy oci://defenseunicorns/uds-k3d:0.21.0-airgap --confirm
          else
            K3S_VERSION="${{ .inputs.k3s_version }}"
            K3D_IMAGE="ghcr.io/defenseunicorns/uds-k3d/k3s:${K3S_VERSION/+k3s/-k3s}"
            ./uds zarf package deploy oci://defenseunicorns/uds-k3d:0.21.0 --set K3D_IMAGE="$K3D_IMAGE" --confirm
          fi

  - name: k3d-test-cluster
    inputs:
      k3s_version:
        default: ""
        description: "Exact K3s version for connected uds-k3d deployments"
    actions:
      - task: create-k3d-cluster
        with:
          k3s_version: "${{ .inputs.k3s_version }}"

      - description: "Initialize the cluster with Zarf"
        # renovate: datasource=github-tags depName=zarf-dev/zarf versioning=semver
        cmd: "./uds zarf package deploy oci://ghcr.io/zarf-dev/packages/init:v0.86.0 --confirm"

      - description: "Verify K3s server version"
        shell:
          darwin: bash
          linux: bash
        cmd: |
          set -euo pipefail
          EXPECTED="${{ .inputs.k3s_version }}"
          if [ -z "$EXPECTED" ]; then
            EXPECTED="${DEFAULT_K3S_VERSION}"
          fi
          ACTUAL=$(./uds zarf tools kubectl version -o json | ./uds zarf tools yq -r '.serverVersion.gitVersion')
          test "$ACTUAL" = "$EXPECTED" || {
            echo "ERROR: Expected K3s $EXPECTED, got $ACTUAL"
            exit 1
          }

  - name: ha-postgres
    actions:
      - description: "Cleanup previous PostgreSQL runs"
        cmd: |
          docker kill postgres || true
          docker rm postgres || true
      - description: "Create a network for the PostgreSQL container"
        cmd: docker network create k3d-uds || true
      - description: "Generate PostgreSQL certs"
        cmd: |
          mkdir -p build/certs
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout build/certs/server.key \
            -out build/certs/server.crt \
            -days 365 -subj "/CN=postgres" > /dev/null 2>&1 || {
              echo "Error: Failed to generate PostgreSQL certs"
              exit 1
            }
          chmod 600 build/certs/server.key
          chmod 644 build/certs/server.crt
      - description: "Prepare PostgreSQL certs inside a temp container"
        cmd: |
          docker run --rm \
            -v $(pwd)/build/certs:/certs \
            --entrypoint bash postgres:16 \
            -c "cp /certs/server.key /certs/fixed.key && \
                cp /certs/server.crt /certs/fixed.crt && \
                chown 999:999 /certs/fixed.key /certs/fixed.crt && \
                chmod 600 /certs/fixed.key && chmod 644 /certs/fixed.crt"
      - description: "Start PostgreSQL Docker container"
        cmd: |
          CONTAINER_NAME=postgres
          # We're using Postgres 16 as this is the compatibility version for RDS
          POSTGRES_VERSION=16
          # RDS (Postgres 16) supports only TLS 1.2 only
          TLS_VERSION=TLSv1.2
          # The official postgres image runs scripts mounted into /docker-entrypoint-initdb.d after initdb and before final startup.
          # See https://github.com/docker-library/docs/blob/master/postgres/README.md#initialization-scripts
          docker run -p 5432:5432 --network=k3d-uds --rm --name $CONTAINER_NAME \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD='unicorn123!@#UN' \
            -v $(pwd)/build/certs/fixed.crt:/var/lib/postgresql/server.crt:ro \
            -v $(pwd)/build/certs/fixed.key:/var/lib/postgresql/server.key:ro \
            -v $(pwd)/scripts/postgres-ha-setup.sql:/docker-entrypoint-initdb.d/postgres-ha-setup.sql:ro \
            -d postgres:$POSTGRES_VERSION \
            -c ssl=on \
            -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key \
            -c ssl_min_protocol_version=$TLS_VERSION \
            -c ssl_max_protocol_version=$TLS_VERSION \
            -c log_connections=on \
            -c log_disconnections=on \
            -c log_min_messages=debug1 \
            -c log_line_prefix='%m [%p] %q%u@%d ' \
            -c log_statement=all
      - description: "Wait for PostgreSQL to be ready"
        cmd: |
          for i in {1..30}; do
            if docker logs postgres 2>&1 | grep -q "PostgreSQL init process complete; ready for start up." && \
              docker exec postgres pg_isready -U postgres; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs postgres
              echo "PostgreSQL failed to become ready"
              exit 1
            fi
            sleep 1
          done

  - name: ha-redis
    actions:
      - description: "Cleanup previous Redis runs"
        cmd: |
          docker kill redis || true
          docker rm redis || true
      - description: "Create a network for the Redis container"
        cmd: docker network create k3d-uds || true
      - description: "Generate Redis ACL file"
        cmd: |
          mkdir -p build/redis
          cat > build/redis/users.acl <<'EOF'
          user default off
          user authservice on >authservice ~* +@all
          EOF
      - description: "Start Redis Docker container"
        cmd: |
          # renovate: datasource=docker depName=redis versioning=docker
          REDIS_VERSION=8.10.2
          docker run -p 6379:6379 --network=k3d-uds --rm --name redis \
            -v $(pwd)/build/redis/users.acl:/usr/local/etc/redis/users.acl:ro \
            -d redis:${REDIS_VERSION} \
            --aclfile /usr/local/etc/redis/users.acl \
            --appendonly yes
      - description: "Wait for Redis to be ready"
        cmd: |
          for i in {1..10}; do
            docker exec redis redis-cli -u redis://authservice:authservice@127.0.0.1:6379 ping && break
            sleep 1
          done
