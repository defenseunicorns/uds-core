variables:
  - name: BASE_REPO
    default: "ghcr.io/defenseunicorns/packages"
  - name: FLAVOR
    default: "upstream"
  - name: SNAPSHOT
    description: Whether this is a snapshot release
    default: "false"

tasks:
  - name: determine-repo
    actions:
      - description: "Determine repository for the given flavor/type of release"
        cmd: |
          repo="${BASE_REPO}"
          # unicorn flavor = private repository
          if [ "${FLAVOR}" = "unicorn" ]; then
            repo="${repo}/private"
          fi
          repo="${repo}/uds"
          # snapshots = snapshot repository
          if [ "${SNAPSHOT}" = "true" ]; then
            repo="${repo}/snapshots"
          fi
          echo "${repo}"
        mute: true
        setVariables:
          - name: TARGET_REPO

  - name: aks-coredns-setup
    actions:
      - description: Setup Custom ConfigMap for Core DNS
        cmd: |
          ./uds zarf tools kubectl apply -f - <<EOF
          apiVersion: v1
          data:
            uds.override: |
              rewrite stop {
                name regex (.*\.admin\.uds\.dev) admin-ingressgateway.istio-admin-gateway.svc.cluster.local answer auto
              }
              rewrite stop {
                name regex (.*\.uds\.dev) tenant-ingressgateway.istio-tenant-gateway.svc.cluster.local answer auto
              }
          kind: ConfigMap
          metadata:
            name: coredns-custom
            namespace: kube-system
          EOF
          ./uds zarf tools kubectl -n kube-system rollout restart deployment coredns

  - name: eks-storageclass-setup
    actions:
      - description: Setup GP3 Storage Class
        cmd: |
          ./uds zarf tools kubectl apply -f - <<EOF
            apiVersion: storage.k8s.io/v1
            kind: StorageClass
            metadata:
              name: gp3
              annotations:
                storageclass.kubernetes.io/is-default-class: "true"
            provisioner: ebs.csi.aws.com
            allowVolumeExpansion: true
            reclaimPolicy: Delete
            volumeBindingMode: WaitForFirstConsumer
            parameters:
              encrypted: "true"
              fsType: ext4
              type: gp3
          EOF

  - name: admin-gw-ip
    actions:
      - description: Fetch Admin Gateway IP Address
        cmd: |
          IP_ADDR=$(./uds zarf tools kubectl get service -n istio-admin-gateway admin-ingressgateway -o=jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -z "$IP_ADDR" ]; then
            HOSTNAME=$(./uds zarf tools kubectl get service -n istio-admin-gateway admin-ingressgateway -o=jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            IP_ADDR=$(dig +short $HOSTNAME | head -n1)
          fi; echo $IP_ADDR
        mute: true
        setVariables:
          - name: ADMIN_GW_IP

  - name: tenant-gw-ip
    actions:
      - description: Fetch Tenant Gateway IP Address
        cmd: |
          IP_ADDR=$(./uds zarf tools kubectl get service -n istio-tenant-gateway tenant-ingressgateway -o=jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
          if [ -z "$IP_ADDR" ]; then
            HOSTNAME=$(./uds zarf tools kubectl get service -n istio-tenant-gateway tenant-ingressgateway -o=jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            IP_ADDR=$(dig +short $HOSTNAME | head -n1)
          fi; echo $IP_ADDR
        mute: true
        setVariables:
          - name: TENANT_GW_IP

  - name: setup-hosts
    actions:
      - task: admin-gw-ip
      - task: tenant-gw-ip
      - description: Adds Cluster LoadBalancer IP Addresses to match appropriate hosts names in /etc/hosts
        mute: true
        cmd: |
          echo "$ADMIN_GW_IP keycloak.admin.uds.dev grafana.admin.uds.dev demo.admin.uds.dev\n$TENANT_GW_IP sso.uds.dev demo-8080.uds.dev demo-8081.uds.dev protected.uds.dev ambient-protected.uds.dev ambient2-protected.uds.dev podinfo.uds.dev portal.uds.dev" | sudo tee -a /etc/hosts

  - name: prepare-node-test-ca
    description: "Prepare the active gateway CA for Node-based e2e tests"
    actions:
      - description: "Extract the final certificate from each gateway serving chain"
        cmd: |
          set -euo pipefail
          CA_FILE="build/uds-test-ca.pem"
          mkdir -p "$(dirname "${CA_FILE}")"
          : > "${CA_FILE}"

          for namespace in istio-admin-gateway istio-tenant-gateway; do
            # `cacert` is the client CA used for mTLS. The serving chain is the
            # correct trust source for the HTTPS endpoints exercised by Vitest.
            # Kubernetes stores that chain leaf-to-root, so trust its final
            # certificate while retaining Node's normal TLS verification.
            encoded_cert=$(./uds zarf tools kubectl -n "${namespace}" get secret gateway-tls -o=jsonpath='{.data.tls\.crt}' 2>/dev/null || true)
            if [ -z "${encoded_cert}" ]; then
              echo "Missing gateway-tls tls.crt in ${namespace}" >&2
              exit 1
            fi

            if base64 -d </dev/null >/dev/null 2>&1; then
              printf '%s' "${encoded_cert}" | base64 -d
            else
              printf '%s' "${encoded_cert}" | base64 -D
            fi | awk '
              /-----BEGIN CERTIFICATE-----/ { certificate = ""; in_certificate = 1 }
              in_certificate { certificate = certificate $0 ORS }
              /-----END CERTIFICATE-----/ { final_certificate = certificate; in_certificate = 0 }
              END {
                if (final_certificate == "") exit 1
                printf "%s", final_certificate
              }
            ' >> "${CA_FILE}"
          done

          if ! grep -q -- "-----BEGIN CERTIFICATE-----" "${CA_FILE}"; then
            echo "Gateway serving chains did not contain PEM certificates" >&2
            exit 1
          fi

  - name: rename-flavored-packages
    description: "Rename flavored package files by removing the flavor suffix"
    actions:
      - description: Rename flavored package files
        cmd: |
          for FLAVORED_PACKAGE in $(find build/ -maxdepth 1 -name "zarf-package-*${FLAVOR}.tar.zst" 2>/dev/null || echo ""); do
            BASE_NAME=$(echo "${FLAVORED_PACKAGE}" | sed "s/-${FLAVOR}\.tar\.zst/.tar.zst/")
            mv -v "${FLAVORED_PACKAGE}" "${BASE_NAME}"
          done

  - name: check-multiarch-images
    description: "Script to check if/what Unicorn and Registry1 images are missing from registry."
    actions:
      - description: Check Unicorn and Registry1 Multi-Arch images
        cmd: ./scripts/check-multiarch.sh
