name: Private PKI Testing

on:
  schedule:
    # Runs every morning at 2:00 AM UTC
    - cron: "0 2 * * *"
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths:
      - ".github/workflows/private-pki-test.yaml"
      - "bundles/k3d-standard/**"
      - "bundles/k3d-standard-next/**"
      - "test/playwright/private-pki/**"

concurrency:
  group: private-pki-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)

jobs:
  uds-core-private-pki-nightly:
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 45
    name: Private PKI

    strategy:
      matrix:
        flavor: [upstream, registry1, unicorn]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}
          installK3d: 'true'

      - name: Generate Private PKI certificates
        run: uds run -f tasks/test.yaml private-pki-certs --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Build Private PKI Core packages
        run: uds run -f tasks/test.yaml private-pki-package-build --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Create Private PKI Core bundle
        run: uds run -f tasks/test.yaml private-pki-bundle-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy Private PKI initialization packages
        run: uds run -f tasks/test.yaml private-pki-deploy-init --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy Private PKI Core packages
        run: uds run -f tasks/test.yaml private-pki-deploy-core --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Validate Private PKI Core
        run: uds run -f tasks/test.yaml private-pki-validate --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Set up Private PKI authservice tests
        run: uds run -f tasks/test.yaml private-pki-authservice-setup --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Run Private PKI Playwright tests
        run: uds run -f tasks/test.yaml private-pki-playwright --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Run Private PKI trust-bundle tests
        run: uds run -f tasks/test.yaml private-pki-trust-bundle-tests --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -private-pki-${{ matrix.flavor }}

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
