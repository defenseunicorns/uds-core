name: Private PKI Testing

on:
  schedule:
    - cron: "29 2 * * *" # Daily UTC; avoid the top-of-hour scheduling peak.
  workflow_call:

concurrency:
  group: private-pki-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  id-token: write
  packages: read
  pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)

jobs:
  nightly-gate:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether Private PKI needs testing
        id: gate
        uses: ./.github/actions/should-run-nightly
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check_name: Nightly Private PKI result

  uds-core-private-pki-nightly:
    needs: nightly-gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.nightly-gate.outputs.run == 'true' || needs.nightly-gate.result == 'failure') }}
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 45
    name: Private PKI

    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}

      - name: Run UDS Core Private PKI Test
        run: uds run -f tasks/test.yaml uds-core-private-pki --set FLAVOR=${{ matrix.flavor }} --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -private-pki-${{ matrix.flavor }}

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}

  nightly-result:
    needs: [nightly-gate, uds-core-private-pki-nightly]
    if: ${{ always() && github.event_name == 'schedule' && (needs.nightly-gate.outputs.run == 'true' || needs.nightly-gate.result == 'failure') }}
    name: Nightly Private PKI result
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Private PKI flavors passed
        env:
          TEST_RESULT: ${{ needs.uds-core-private-pki-nightly.result }}
        run: test "$TEST_RESULT" = success
