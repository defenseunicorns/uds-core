name: Slim Dev

# This workflow is triggered on pull requests
on:
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths:
      - src/pepr/**
      - src/keycloak/**
      - src/authservice/**
      - src/istio/**
      - src/prometheus-stack/**
      - packages/base/**
      - packages/identity-authorization/**
      - bundles/k3d-slim-dev/**
      - bundles/k3d-slim-dev-next/**
      - .github/workflows/slim-dev**
      - tasks/test.yaml
      - "!**/*.md"
      - "!**.jpg"
      - "!**.png"
      - "!**.gif"
      - "!**.svg"

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  id-token: write # Needed for OIDC-related operations.
  contents: read # Allows reading the content of the repository.

# Default settings for all run commands in the workflow jobs.
defaults:
  run:
    shell: bash -e -o pipefail {0} # Ensures that scripts fail on error and pipefail is set.

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-slim-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    runs-on: ubuntu-latest
    outputs:
      run_full_tests: ${{ steps.test-routing.outputs.run_full_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute test routing
        id: test-routing
        uses: ./.github/actions/test-routing
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          head_ref: ${{ github.head_ref }}

  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint-check
        uses: ./.github/actions/lint-check

  autogenerated-check:
    needs: routing
    if: ${{ needs.routing.outputs.run_full_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: autogenerated-check
        uses: ./.github/actions/autogenerated-check

  # This job runs the CLI Next slim-dev bundle create/deploy process.
  test-next:
    name: Test Next
    runs-on: ubuntu-latest
    needs: [routing, lint-check, autogenerated-check]
    if: ${{ needs.routing.outputs.run_full_tests == 'true' }}
    permissions:
      id-token: write # Needed for OIDC-related operations.
      contents: read # Allows reading the content of the repository.
      pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          installK3d: 'true'
      - name: Clean up space on the GitHub runner
        continue-on-error: true
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
      - name: Build Slim Dev Bundle with UDS CLI Next
        run: uds run slim-dev-build-next --no-progress
      - name: Deploy Slim Dev Bundle with UDS CLI Next
        run: uds run slim-dev-deploy-next --no-progress
      - name: Validate Slim Dev Bundle
        run: uds run -f tasks/test.yaml slim-validate --no-progress
      - name: Create Slim Dev test resource package
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress
      - name: Deploy Slim Dev test resources
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --with validate_egress=false --with validate_udp_expose=false --no-progress
      - name: Validate Slim Dev test resources
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress
      - name: Run Slim Dev network tests
        run: uds run -f tasks/test.yaml slim-e2e-network-tests --no-progress
      - name: Run Slim Dev test-resource tests
        run: uds run -f tasks/test.yaml slim-e2e-test-resource-tests --no-progress
      - name: Set up Slim Dev test user
        run: uds run -f tasks/test.yaml slim-e2e-keycloak-user --no-progress
      - name: Run Slim Dev Playwright tests
        run: uds run -f tasks/test.yaml slim-e2e-playwright --no-progress
      - name: Run Slim Dev secret reload tests
        run: uds run -f tasks/test.yaml slim-e2e-secret-reload-tests --no-progress
      - name: Clean up Slim Dev test resources
        run: uds run -f tasks/test.yaml slim-e2e-cleanup --no-progress
      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output
      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -slim-dev-next

  # This job runs the Legacy slim-dev bundle create/deploy process.
  test-legacy:
    name: Test Legacy
    runs-on: ubuntu-latest
    needs: [routing, lint-check, autogenerated-check]
    if: ${{ needs.routing.outputs.run_full_tests == 'true' }}
    permissions:
      id-token: write # Needed for OIDC-related operations.
      contents: read # Allows reading the content of the repository.
      pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          installK3d: 'true'
      - name: Clean up space on the GitHub runner
        continue-on-error: true
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
      - name: Build Slim Dev Legacy Bundle
        run: uds run slim-dev-build-legacy --no-progress
      - name: Deploy Slim Dev Legacy Bundle
        run: uds run slim-dev-deploy-legacy --no-progress
      - name: Validate Slim Dev Legacy Bundle
        run: uds run -f tasks/test.yaml slim-validate --no-progress
      - name: Create Slim Dev Legacy test resource package
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress
      - name: Deploy Slim Dev Legacy test resources
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --with validate_egress=false --with validate_udp_expose=false --no-progress
      - name: Validate Slim Dev Legacy test resources
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress
      - name: Run Slim Dev Legacy network tests
        run: uds run -f tasks/test.yaml slim-e2e-network-tests --no-progress
      - name: Run Slim Dev Legacy test-resource tests
        run: uds run -f tasks/test.yaml slim-e2e-test-resource-tests --no-progress
      - name: Set up Slim Dev Legacy test user
        run: uds run -f tasks/test.yaml slim-e2e-keycloak-user --no-progress
      - name: Run Slim Dev Legacy Playwright tests
        run: uds run -f tasks/test.yaml slim-e2e-playwright --no-progress
      - name: Run Slim Dev Legacy secret reload tests
        run: uds run -f tasks/test.yaml slim-e2e-secret-reload-tests --no-progress
      - name: Clean up Slim Dev Legacy test resources
        run: uds run -f tasks/test.yaml slim-e2e-cleanup --no-progress
      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output
      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -slim-dev-legacy
