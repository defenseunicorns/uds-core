name: Kubernetes Compatibility

env:
  K3S_MATRIX: |-
    {
      "versions": [
        "v1.34.4+k3s1",
        "v1.35.8+k3s1"
      ],
      "flavors": ["upstream", "registry1", "unicorn"]
    }

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      k3s_versions:
        description: "Comma-separated exact stable K3s versions; blank uses the matrix file"
        required: false
        type: string
      flavors:
        description: "Comma-separated flavors; blank uses the matrix file"
        required: false
        type: string
  pull_request:
    # milestoned supports release-please pull requests, which do not trigger normal PR workflows.
    types: [milestoned, opened, reopened, synchronize]
    branches:
      - main
      - "release/**"
    paths:
      - ".release-please-manifest.json"
      - ".github/workflows/test-kubernetes-matrix.yaml"
      - ".github/workflows/test.yaml"
      - "tasks/setup.yaml"
      - "tasks/test.yaml"

concurrency:
  group: test-kubernetes-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      k3s_versions: ${{ steps.matrix.outputs.k3s_versions }}
      flavors: ${{ steps.matrix.outputs.flavors }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Convert matrix inputs
        id: matrix
        env:
          K3S_MATRIX: ${{ env.K3S_MATRIX }}
          K3S_VERSIONS_INPUT: ${{ inputs.k3s_versions }}
          FLAVORS_INPUT: ${{ inputs.flavors }}
        shell: bash
        run: |
          set -euo pipefail
          k3s_versions=$(printf '%s' "$K3S_MATRIX" | jq -c '.versions')
          flavors=$(printf '%s' "$K3S_MATRIX" | jq -c '.flavors')

          input_to_json() {
            printf '%s' "$1" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          }

          if [ -n "$K3S_VERSIONS_INPUT" ]; then
            k3s_versions=$(input_to_json "$K3S_VERSIONS_INPUT")
          fi
          if [ -n "$FLAVORS_INPUT" ]; then
            flavors=$(input_to_json "$FLAVORS_INPUT")
          fi
          {
            echo "k3s_versions<<EOF"
            echo "$k3s_versions"
            echo "EOF"
            echo "flavors<<EOF"
            echo "$flavors"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Kubernetes compatibility (${{ matrix.k3s_version }}, ${{ matrix.flavor }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        k3s_version: ${{ fromJSON(needs.prepare.outputs.k3s_versions) }}
        flavor: ${{ fromJSON(needs.prepare.outputs.flavors) }}
    uses: ./.github/workflows/test.yaml
    with:
      package: all
      flavor: ${{ matrix.flavor }}
      test_type: values
      k3s_version: ${{ matrix.k3s_version }}
    secrets:
      IRON_BANK_ROBOT_USERNAME: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
      IRON_BANK_ROBOT_PASSWORD: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}
      CHAINGUARD_IDENTITY: ${{ secrets.CHAINGUARD_IDENTITY }}

  aggregate:
    name: Kubernetes compatibility complete
    if: ${{ always() }}
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify matrix results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          test "$PREPARE_RESULT" = success && test "$TEST_RESULT" = success

      - name: Checkout repository
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send Slack notification
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
