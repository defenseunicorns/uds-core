name: Filter

# This workflow is triggered on pull requests
on:
  pull_request:
    branches:
      - main
      - "release/**"
    # Engineers trigger Release Please PR checks by adding a PR label.
    types: [labeled, opened, reopened, synchronize]

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  checks: read
  id-token: write # Needed for OIDC-related operations.
  contents: read # Allows reading the content of the repository.
  pull-requests: write # Allows writing pull request metadata.
  packages: read # Allows reading the published GHCR packages

# Default settings for all run commands in the workflow jobs.
defaults:
  run:
    shell: bash -e -o pipefail {0} # Ensures that scripts fail on error and pipefail is set.

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint-check
        uses: ./.github/actions/lint-check

  autogenerated-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: autogenerated-check
        uses: ./.github/actions/autogenerated-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unit-tests
        uses: ./.github/actions/unit-tests

  values-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_core_tests == 'true' || needs.check-paths.outputs.run_upgrade_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: values-tests
        uses: ./.github/actions/values-tests

  # Route full Core installs and release upgrades after identifying Core-relevant changes.
  check-paths:
    runs-on: ubuntu-latest
    name: Select Jobs
    outputs:
      run_core_tests: ${{ steps.path-filter-all.outputs.all }}
      run_docs_tests: ${{ steps.path-filter-docs.outputs.docs }}
      run_autogenerated_tests: ${{ steps.path-filter-docs.outputs.autogenerated }}
      run_compatibility_tests: ${{ steps.path-filter-docs.outputs.compatibility }}
      run_private_pki_tests: ${{ steps.path-filter-docs.outputs.private_pki }}
      run_k0s_tests: ${{ steps.path-filter-docs.outputs.k0s }}
      run_slim_tests: ${{ steps.path-filter-docs.outputs.slim }}
      run_checkpoint_tests: ${{ steps.path-filter-docs.outputs.checkpoint }}
      run_scripts_tests: ${{ steps.path-filter-docs.outputs.scripts }}
      run_ca_certs_tests: ${{ steps.path-filter-docs.outputs.ca_certs }}
      run_kubernetes_tests: ${{ steps.path-filter-docs.outputs.kubernetes }}
      run_full_tests: ${{ github.base_ref == 'main' || (startsWith(github.base_ref, 'release/') && startsWith(github.head_ref, 'release-please')) }}
      run_upgrade_tests: ${{ startsWith(github.head_ref, 'release-please') && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
      run_layer_tests: ${{ steps.path-filter-layers.outputs.changes }}
      portal_only: ${{ steps.path-filter-flavors.outputs.non_portal != 'true' }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Exclude cloud-only changes from local Core cluster tests.
      # Noting that adding `predicate-quantifier` produces a false warning message about an unexpected input, despite still being evaluated by the action
      - name: Check Core-relevant paths
        id: path-filter-all
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: .github/filters/core-pr.yaml

      - name: Check changed layers
        id: path-filter-layers
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yaml

      - name: Check documentation paths
        id: path-filter-docs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            autogenerated:
              - "src/**"
              - "packages/**"
              - "tasks/**"
              - "schemas/**"
              - "docs/reference/operator-and-crds/**"
              - ".github/actions/autogenerated-check/**"
              - ".github/workflows/pull-request-conditionals.yaml"
            docs:
              - "**.md"
              - "**.jpg"
              - "**.png"
              - "**.gif"
              - "**.svg"
              - "docs/**"
              - ".vscode/**"
              - ".gitignore"
              - "renovate.json"
              - ".codespellrc"
              - ".release-please-config.json"
              - "release-please-config.json"
              - "CODEOWNERS"
              - "LICENSE"
              - "scripts/**"
              - ".github/workflows/docs-shim.yaml"
            compatibility:
              - "bundles/k3d-standard/**"
              - "bundles/k3d-standard-next/**"
              - "tasks/test.yaml"
              - "tasks/deploy.yaml"
              - ".github/workflows/test-cli-matrix.yaml"
              - ".github/workflows/test-k3d-ha.yaml"
            private_pki:
              - ".github/workflows/private-pki-test.yaml"
              - "bundles/k3d-standard/**"
              - "bundles/k3d-standard-next/**"
              - "test/playwright/private-pki/**"
            k0s:
              - ".github/workflows/test-k0s.yaml"
              - "tasks/setup.yaml"
              - "tasks/deploy.yaml"
              - "tasks/create.yaml"
              - "tasks/test.yaml"
              - "bundles/k3d-standard-next/**"
              - ".github/test-infra/k0s/**"
              - "packages/base/**"
              - "packages/crds/**"
              - "packages/backup-restore/**"
              - "packages/runtime-security/**"
              - "src/istio/**"
              - "src/envoy-gateway/**"
              - "src/pepr/**"
              - "src/velero/**"
              - "src/falco/**"
              - ".release-please-manifest.json"
              - "release-please-config.json"
            slim:
              - "src/pepr/**"
              - "src/keycloak/**"
              - "src/authservice/**"
              - "src/istio/**"
              - "src/prometheus-stack/**"
              - "packages/base/**"
              - "packages/identity-authorization/**"
              - "bundles/k3d-slim-dev/**"
              - "bundles/k3d-slim-dev-next/**"
              - ".github/workflows/slim-dev-test.yaml"
              - "tasks/test.yaml"
            checkpoint:
              - "packages/checkpoint-dev/**"
              - ".github/workflows/checkpoint**"
              - "tasks/test.yaml"
            scripts:
              - "scripts/renovate/**"
              - "scripts/root-ca-retriever/**"
              - ".github/workflows/scripts-test.yaml"
            ca_certs:
              - "certs/**"
              - "scripts/root-ca-retriever/**"
              - "src/pepr/uds-operator-config/templates/uds-ca-certs.yaml"
              - ".github/workflows/check-ca-certs.yaml"
            kubernetes:
              - ".github/workflows/test-kubernetes-matrix.yaml"

      - name: Check for changes outside Portal
        id: path-filter-flavors
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            non_portal:
              - "**"
              - "!src/portal/**"
              - "!packages/portal/**"

  check-multiarch:
    runs-on: ubuntu-latest
    name: Check multi-arch images
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
          registry1Password: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}
          chainguardIdentity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Check multi-arch images
        uses: ./.github/actions/check-multiarch

  core-installs:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_core_tests == 'true' || needs.check-paths.outputs.run_upgrade_tests == 'true') }}
    name: Full Core install (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(needs.check-paths.outputs.portal_only == 'true' && needs.check-paths.outputs.run_upgrade_tests != 'true' && '["upstream","unicorn"]' || '["upstream","registry1","unicorn"]') }}
    uses: ./.github/workflows/test.yaml
    with:
      package: all
      flavor: ${{ matrix.flavor }}
      test_type: install
    secrets: inherit

  layer-installs:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && needs.check-paths.outputs.run_layer_tests != '' && needs.check-paths.outputs.run_layer_tests != '[]' }}
    name: Layer install (${{ matrix.package }}, ${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.check-paths.outputs.run_layer_tests) }}
        flavor: [upstream, registry1, unicorn]
        exclude:
          - package: portal
            flavor: registry1
    uses: ./.github/workflows/test.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: install
    secrets: inherit

  core-release-upgrades:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' }}
    name: Full Core upgrade (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    uses: ./.github/workflows/test.yaml
    with:
      package: all
      flavor: ${{ matrix.flavor }}
      test_type: upgrade
    secrets: inherit

  core-opt-in-upgrades:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests != 'true' && contains(github.event.pull_request.labels.*.name, 'test-upgrades') }}
    name: Full Core opt-in upgrade (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    uses: ./.github/workflows/test.yaml
    with:
      package: all
      flavor: ${{ matrix.flavor }}
      test_type: upgrade
    secrets: inherit

  run-docs-tests:
    needs: [check-paths]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests != 'true' && needs.check-paths.outputs.run_docs_tests == 'true' }}
    name: Documentation
    uses: ./.github/workflows/docs-shim.yaml
    secrets: inherit

  run-cli-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_compatibility_tests == 'true' }}
    name: CLI compatibility
    uses: ./.github/workflows/test-cli-matrix.yaml
    secrets: inherit

  run-ha-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_compatibility_tests == 'true' }}
    name: HA compatibility
    uses: ./.github/workflows/test-k3d-ha.yaml
    secrets: inherit

  run-private-pki-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_private_pki_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true') }}
    name: Private PKI
    uses: ./.github/workflows/private-pki-test.yaml
    secrets: inherit

  run-k0s-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_k0s_tests == 'true' }}
    name: K0s
    uses: ./.github/workflows/test-k0s.yaml
    secrets: inherit

  run-slim-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_slim_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true')) }}
    name: Slim Dev
    uses: ./.github/workflows/slim-dev-test.yaml
    secrets: inherit

  run-checkpoint-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_checkpoint_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true')) }}
    name: Checkpoint
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/checkpoint.yaml
    secrets: inherit

  run-scripts-tests:
    needs: [check-paths]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests != 'true' && needs.check-paths.outputs.run_scripts_tests == 'true' }}
    name: Script tests
    uses: ./.github/workflows/scripts-test.yaml
    secrets: inherit

  run-ca-certs-tests:
    needs: [check-paths]
    if: ${{ needs.check-paths.outputs.run_upgrade_tests != 'true' && github.base_ref == 'main' && needs.check-paths.outputs.run_ca_certs_tests == 'true' }}
    name: CA certificates
    uses: ./.github/workflows/check-ca-certs.yaml
    secrets: inherit

  run-kubernetes-tests:
    needs: [check-paths, lint-check, autogenerated-check, unit-tests, check-multiarch]
    if: ${{ needs.check-paths.outputs.run_kubernetes_tests == 'true' }}
    name: Kubernetes compatibility
    uses: ./.github/workflows/test-kubernetes-matrix.yaml
    secrets: inherit

  core-upgrade-status:
    name: Required Core upgrades
    needs: [check-paths, core-release-upgrades, core-opt-in-upgrades]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests == 'true' || contains(github.event.pull_request.labels.*.name, 'test-upgrades')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require release upgrades
        if: ${{ needs.check-paths.outputs.run_upgrade_tests == 'true' }}
        run: test "${{ needs.core-release-upgrades.result }}" = success
      - name: Require opt-in upgrades
        if: ${{ needs.check-paths.outputs.run_upgrade_tests != 'true' }}
        run: test "${{ needs.core-opt-in-upgrades.result }}" = success

  core-install-status:
    name: Required Core installs
    needs: [check-paths, core-installs, layer-installs]
    if: ${{ always() && (needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_core_tests == 'true' || needs.check-paths.outputs.run_upgrade_tests == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.core-installs.result }}" = success
      - name: Require selected layer tests
        if: ${{ needs.check-paths.outputs.run_layer_tests != '' && needs.check-paths.outputs.run_layer_tests != '[]' }}
        run: test "${{ needs.layer-installs.result }}" = success

  cloud-status:
    name: Required cloud deployments
    needs: [check-paths]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Cloud PR tests paused
        run: echo "Cloud PR tests are paused for this experiment."

  docs-status:
    name: Required documentation
    needs: [check-paths, run-docs-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests != 'true' && needs.check-paths.outputs.run_docs_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-docs-tests.result }}" = success

  cli-status:
    name: Required CLI compatibility
    needs: [check-paths, run-cli-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_compatibility_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-cli-tests.result }}" = success

  ha-status:
    name: Required HA compatibility
    needs: [check-paths, run-ha-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_compatibility_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-ha-tests.result }}" = success

  private-pki-status:
    name: Required Private PKI
    needs: [check-paths, run-private-pki-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_private_pki_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-private-pki-tests.result }}" = success

  k0s-status:
    name: Required K0s
    needs: [check-paths, run-k0s-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests == 'true' || needs.check-paths.outputs.run_k0s_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-k0s-tests.result }}" = success

  slim-status:
    name: Required Slim Dev
    needs: [check-paths, run-slim-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_slim_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-slim-tests.result }}" = success

  checkpoint-status:
    name: Required Checkpoint
    needs: [check-paths, run-checkpoint-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_full_tests == 'true' && (needs.check-paths.outputs.run_upgrade_tests == 'true' || (needs.check-paths.outputs.run_checkpoint_tests == 'true' && needs.check-paths.outputs.run_core_tests == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-checkpoint-tests.result }}" = success

  scripts-status:
    name: Required script tests
    needs: [check-paths, run-scripts-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests != 'true' && needs.check-paths.outputs.run_scripts_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-scripts-tests.result }}" = success

  ca-certs-status:
    name: Required CA certificates
    needs: [check-paths, run-ca-certs-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_upgrade_tests != 'true' && github.base_ref == 'main' && needs.check-paths.outputs.run_ca_certs_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-ca-certs-tests.result }}" = success

  kubernetes-status:
    name: Required Kubernetes compatibility
    needs: [check-paths, run-kubernetes-tests]
    if: ${{ always() && (needs.check-paths.outputs.run_kubernetes_tests == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require selected tests
        run: test "${{ needs.run-kubernetes-tests.result }}" = success
