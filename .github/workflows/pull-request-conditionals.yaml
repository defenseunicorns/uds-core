name: Filter

# This workflow is triggered on pull requests
on:
  pull_request:
    branches:
      - main
      - "release/**"
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - docs/**
      - .vscode/**
      - .gitignore
      - renovate.json
      - .release-please-config.json
      - .codespellrc
      - release-please-config.json
      - CODEOWNERS
      - LICENSE
      - scripts/renovate/**
      - scripts/root-ca-retriever/**

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  id-token: write # Needed for OIDC-related operations.
  contents: read # Allows reading the content of the repository.
  pull-requests: write # Allows writing pull request metadata.
  packages: read # Allows reading the published GHCR packages

# Default settings for all run commands in the workflow jobs.
defaults:
  run:
    shell: bash -e -o pipefail {0} # Ensures that scripts fail on error and pipefail is set.

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lint-check
        uses: ./.github/actions/lint-check

  autogenerated-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: autogenerated-check
        uses: ./.github/actions/autogenerated-check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unit-tests
        uses: ./.github/actions/unit-tests

  values-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: values-tests
        uses: ./.github/actions/values-tests

  # This job checks if there are changes in specific paths source packages.
  check-paths:
    runs-on: ubuntu-latest
    name: Select Jobs
    outputs:
      combined: ${{ steps.combine-path-filters.outputs.combined }}
      layers: ${{ steps.combine-path-filters.outputs.layers }}
      distros: ${{ steps.path-filter-iac.outputs.changes }}
      run_full_tests: ${{ steps.test-routing.outputs.run_full_tests }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Add a custom filter for all packages that excludes any changes to IaC testing related config
      # Noting that adding `predicate-quantifier` produces a false warning message about an unexpected input, despite still being evaluated by the action
      - name: Check src paths - all
        id: path-filter-all
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            all:
              - "**"
              - "!.github/workflows/test-aks.yaml"
              - "!.github/workflows/test-eks.yaml"
              - "!.github/workflows/test-rke2.yaml"
              - "!.github/bundles/**"
              - "!.github/test-infra/**"
              - "!tasks/iac.yaml"

      # Uses a custom action to filter paths for source packages.
      - name: Check src paths - packages
        id: path-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yaml

      - name: Merge Path Filter Outputs for Packages
        id: combine-path-filters
        run: |
          allPackageChanges='${{ steps.path-filter-all.outputs.changes }}'
          packageChanges='${{ steps.path-filter.outputs.changes }}'
          COMBINED=$(echo "$allPackageChanges" "$packageChanges" | jq -s 'add')
          LAYERS=$(echo "$COMBINED" | jq -c 'map(select(. != "all"))')
          echo "combined=$COMBINED" >> "$GITHUB_OUTPUT"
          echo "layers=$LAYERS" >> "$GITHUB_OUTPUT"
          echo The following packages will be triggered: $COMBINED

      - name: Compute test routing
        id: test-routing
        uses: ./.github/actions/test-routing
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          head_ref: ${{ github.head_ref }}

  # Build the core package and bundle once per flavor so install, upgrade, and values tests can reuse them.
  build-core:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && contains(needs.check-paths.outputs.combined, '"all"') }}
    runs-on: uds-ubuntu-big-boy-8-core
    name: Build Core (${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY: validate artifact reuse with one representative flavor first.
        flavor: [upstream]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}

      - name: Build Core package
        env:
          ZARF_ARCHITECTURE: amd64
        run: uds run -f tasks/create.yaml standard-package --no-progress --with create_options="--skip-sbom" --set FLAVOR=${{ matrix.flavor }}

      - name: Build Core bundle
        env:
          ZARF_ARCHITECTURE: amd64
        run: uds run -f tasks/create.yaml k3d-standard-bundle --no-progress

      - name: Archive Core artifacts
        run: |
          set -euo pipefail
          tar -cf core-artifacts.tar \
            build/zarf-package-core-*.tar.zst \
            bundles/k3d-standard/uds-bundle-k3d-core-demo-*.tar.zst

      - name: Upload Core artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-${{ matrix.flavor }}
          path: core-artifacts.tar
          if-no-files-found: error
          retention-days: 1

  check-multiarch:
    # TEMPORARY: disabled while validating the CI workflow changes.
    if: ${{ false }}
    runs-on: ubuntu-latest
    name: Check multi-arch images
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
          registry1Password: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}
          chainguardIdentity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Check multi-arch images
        uses: ./.github/actions/check-multiarch

  # @lulaStart 11948466-9230-4498-be44-dbac784d86d1
  # This job triggers a separate workflow for each changed source package, if any.
  run-package-test:
    # TEMPORARY: layer tests are outside the current CI changes.
    if: ${{ false }}
    needs: check-paths
    name: Schedule
    strategy:
      matrix:
        package: ${{ fromJson(needs.check-paths.outputs.layers) }}
        flavor: [upstream, registry1, unicorn]
        test_type: [install]
        # Portal is not available in registry1; skip single-layer tests for that flavor
        exclude:
          - package: portal
            flavor: registry1
    uses: ./.github/workflows/test.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: ${{ matrix.test_type }}
    secrets: inherit # Inherits all secrets from the parent workflow.
  # @lulaEnd 11948466-9230-4498-be44-dbac784d86d1

  # Core tests share the artifacts built above. Layer tests remain independent and can start as soon as routing finishes.
  run-core-test:
    needs: [check-paths, build-core]
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && contains(needs.check-paths.outputs.combined, '"all"') }}
    name: Schedule Core
    strategy:
      matrix:
        include:
          # TEMPORARY: validate artifact reuse with one representative flavor first.
          - package: all
            flavor: upstream
            test_type: install
          - package: all
            flavor: upstream
            test_type: upgrade
          - package: all
            flavor: upstream
            test_type: values
    uses: ./.github/workflows/test.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: ${{ matrix.test_type }}
      core_artifact: core-${{ matrix.flavor }}
    secrets: inherit

  # Shim required checks for backport PRs to release branches (i.e., non-release-please PRs)
  run-package-test-shim:
    # TEMPORARY: release-branch shim tests are outside the current CI changes.
    needs: check-paths
    if: ${{ false }}
    name: Schedule
    strategy:
      matrix:
        package: [all]
        flavor: [upstream, registry1, unicorn]
        test_type: [install, upgrade]
    uses: ./.github/workflows/test-shim.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: ${{ matrix.test_type }}
    secrets: inherit
