name: Filter

# This workflow is triggered on pull requests
on:
  pull_request:
    branches:
      - main
      - "release/**"
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths-ignore:
      - "**.md"
      - "**.jpg"
      - "**.png"
      - "**.gif"
      - "**.svg"
      - docs/**
      - .vscode/**
      - .gitignore
      - renovate.json
      - .release-please-config.json
      - .codespellrc
      - release-please-config.json
      - CODEOWNERS
      - LICENSE
      - scripts/renovate/**
      - scripts/root-ca-retriever/**

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  id-token: write # Needed for OIDC-related operations.
  contents: read # Allows reading the content of the repository.
  pull-requests: write # Allows writing pull request metadata.
  packages: read # Allows reading the published GHCR packages

# Default settings for all run commands in the workflow jobs.
defaults:
  run:
    shell: bash -e -o pipefail {0} # Ensures that scripts fail on error and pipefail is set.

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment setup
        uses: ./.github/actions/setup-tools
      - name: Install lint dependencies
        run: npm ci
      - name: Run formatting checks
        run: npm run format:check
      - name: Build Pepr module for values lint
        run: uds run -f tasks/lint.yaml build-pepr --no-progress
      - name: Lint packages that expose Zarf values
        run: uds run -f tasks/lint.yaml values-lint --no-progress
      - name: Run YAML lint
        run: yamllint . -c .yamllint --no-warnings
      - name: Run codespell lint
        run: codespell
      - name: Verify addlicense is installed
        run: command -v addlicense
      - name: Run license lint
        run: uds run -f tasks/lint.yaml license --no-progress
      - name: Run Helm unit tests
        run: uds run -f tasks/lint.yaml helm-unittest --no-progress

  autogenerated-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment setup
        uses: ./.github/actions/setup-tools
      - name: Install autogenerated-check dependencies
        run: npm ci
      - name: Verify addlicense is installed
        run: command -v addlicense
      - name: Generate Pepr CRDs
        run: uds run -f src/pepr/tasks.yaml gen-crds --no-progress
      - name: Generate Istio CRDs
        run: uds run -f src/istio/tasks.yaml gen-crds --no-progress
      - name: Update Gateway API CRDs
        run: uds run -f src/istio/tasks.yaml update-gateway-api-crds --no-progress
      - name: Generate Prometheus Stack CRDs
        run: uds run -f src/prometheus-stack/tasks.yaml gen-crds --no-progress
      - name: Generate CA certificate values
        run: uds run -f src/keycloak/tasks.yaml cacert --no-progress
      - name: Update Falco rules
        run: uds run -f src/falco/tasks.yaml update-rules --no-progress
      - name: Update Velero CRDs
        run: uds run -f src/velero/tasks.yaml update-crds --no-progress
      - name: Generate Zarf values schemas
        run: uds run -f tasks/lint.yaml values-generate --no-progress
      - name: Check generated files for diffs
        shell: bash
        run: |
          # Check for specific diffs
          DIFFS=false

          if [ ! -z "$(git status -s src/pepr/operator/crd/generated/ schemas/ docs/reference/operator-and-crds/ src/pepr/uds-cluster-crds/templates/ src/istio/gateway-api-crds/chart/templates/gateway-api-crds.yaml)" ]; then
            # Diffs for CRDs
            DIFFS=true
            echo -e "\033[33m⚠️ Autogenerated CRD files are not up to date, please run \`uds run -f src/pepr/tasks.yaml gen-crds\`, \`uds run -f src/istio/tasks.yaml gen-crds\`, \`uds run -f src/istio/tasks.yaml update-gateway-api-crds\`, and \`uds run -f src/prometheus-stack/tasks.yaml gen-crds\` and commit the changes.\033[0m"
          fi

          if [ ! -z "$(git status -s src/istio/values/)" ]; then
            # Diffs for CACerts
            DIFFS=true
            echo -e "\033[33m⚠️ Autogenerated CACerts are not up to date, please run \`uds run -f src/keycloak/tasks.yaml cacert\` and commit the changes.\033[0m"
          fi

          if [ ! -z "$(git status -s src/falco/chart/rules/)" ]; then
            # Diffs for Falco rules
            DIFFS=true
            echo -e "\033[33m⚠️ Falco rules are not up to date, please run \`uds run -f src/falco/tasks.yaml update-rules\` and commit the changes.\033[0m"
          fi

          if [ ! -z "$(git status -s src/velero/chart/templates/crds/)" ]; then
            # Diffs for Velero CRDs
            DIFFS=true
            echo -e "\033[33m⚠️ Velero CRDs are not up to date, please run \`uds run -f src/velero/tasks.yaml update-crds\` and commit the changes.\033[0m"
          fi

          if [ ! -z "$(git status -s packages/*/zarf-values.schema.json)" ]; then
            # Diffs for Zarf values schemas
            DIFFS=true
            echo -e "\033[33m⚠️ Zarf values schemas are not up to date, please run \`uds run -f tasks/lint.yaml values-generate\` and commit the changes.\033[0m"
            echo "Changed schema files:"
            git status --short -- packages/*/zarf-values.schema.json
            git diff --stat -- packages/*/zarf-values.schema.json
            echo "This check runs against the pull request merge ref. If local generation is clean, sync the branch with main and regenerate the schemas."
          fi

          if [ "${DIFFS}" = "true" ]; then
            echo -e "\033[31m❌ ERROR: Ensure that all generated file changes are up to date and committed (see warnings above).\033[0m"
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Environment setup
        uses: ./.github/actions/setup-tools
      - name: Install unit-test dependencies
        run: npm ci
      - name: Build Pepr test chart
        run: npx pepr build -z chart
      - name: Run unit tests
        run: npx vitest run

  # This job checks if there are changes in specific paths source packages.
  check-paths:
    needs: [lint-check, autogenerated-check, unit-tests]
    runs-on: ubuntu-latest
    name: Select Jobs
    outputs:
      combined: ${{ steps.combine-path-filters.outputs.combined }}
      distros: ${{ steps.path-filter-iac.outputs.changes }}
      run_full_tests: ${{ steps.test-routing.outputs.run_full_tests }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Add a custom filter for all packages that excludes any changes to IaC testing related config
      # Noting that adding `predicate-quantifier` produces a false warning message about an unexpected input, despite still being evaluated by the action
      - name: Check src paths - all
        id: path-filter-all
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            all:
              - "**"
              - "!.github/workflows/test-aks.yaml"
              - "!.github/workflows/test-eks.yaml"
              - "!.github/workflows/test-rke2.yaml"
              - "!.github/bundles/**"
              - "!.github/test-infra/**"
              - "!tasks/iac.yaml"

      # Uses a custom action to filter paths for source packages.
      - name: Check src paths - packages
        id: path-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters.yaml

      - name: Merge Path Filter Outputs for Packages
        id: combine-path-filters
        run: |
          allPackageChanges='${{ steps.path-filter-all.outputs.changes }}'
          packageChanges='${{ steps.path-filter.outputs.changes }}'
          COMBINED=$(echo $allPackageChanges $packageChanges | jq -s 'add')
          echo combined=$COMBINED >> $GITHUB_OUTPUT
          echo The following packages will be triggered: $COMBINED

      - name: Compute test routing
        id: test-routing
        uses: ./.github/actions/test-routing
        with:
          event_name: ${{ github.event_name }}
          base_ref: ${{ github.base_ref }}
          head_ref: ${{ github.head_ref }}

  check-multiarch:
    runs-on: ubuntu-latest
    name: Check multi-arch images
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ secrets.IRON_BANK_ROBOT_USERNAME }}
          registry1Password: ${{ secrets.IRON_BANK_ROBOT_PASSWORD }}
          chainguardIdentity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Check multi-arch images
        uses: ./.github/actions/check-multiarch

  # @lulaStart 11948466-9230-4498-be44-dbac784d86d1
  # This job triggers a separate workflow for each changed source package, if any.
  run-package-test:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.run_full_tests == 'true' && needs.check-paths.outputs.combined != '' && needs.check-paths.outputs.combined != '[]' }}
    name: Schedule
    strategy:
      matrix:
        package: ${{ fromJson(needs.check-paths.outputs.combined) }}
        flavor: [upstream, registry1, unicorn]
        test_type: [install]
        # Upgrade tests are included for all flavors, but ONLY for `all` package tests
        include:
          - package: all
            flavor: registry1
            test_type: upgrade
          - package: all
            flavor: upstream
            test_type: upgrade
          - package: all
            flavor: unicorn
            test_type: upgrade
        # Portal is not available in registry1; skip single-layer tests for that flavor
        exclude:
          - package: portal
            flavor: registry1
    uses: ./.github/workflows/test.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: ${{ matrix.test_type }}
    secrets: inherit # Inherits all secrets from the parent workflow.
  # @lulaEnd 11948466-9230-4498-be44-dbac784d86d1

  # Shim required checks for backport PRs to release branches (i.e., non-release-please PRs)
  run-package-test-shim:
    needs: check-paths
    if: ${{ needs.check-paths.outputs.run_full_tests != 'true' && startsWith(github.base_ref, 'release/') }}
    name: Schedule
    strategy:
      matrix:
        package: [all]
        flavor: [upstream, registry1, unicorn]
        test_type: [install, upgrade]
    uses: ./.github/workflows/test-shim.yaml
    with:
      package: ${{ matrix.package }}
      flavor: ${{ matrix.flavor }}
      test_type: ${{ matrix.test_type }}
    secrets: inherit
