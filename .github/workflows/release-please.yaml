name: Release Please

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.
  packages: read # Allows reading the content of the repository's packages.
  id-token: write

on:
  push:
    branches:
      - main
      - "release/**"

jobs:
  # @lulaStart d364a8e6-95ab-448c-bb97-9f456c85b54f
  release-please:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UDS_RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.UDS_RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ startsWith(github.ref, 'refs/heads/release/') && 'release-please-config.patch.json' || 'release-please-config.json' }}
  # @lulaEnd d364a8e6-95ab-448c-bb97-9f456c85b54f
