name: Scripts Tests

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.

on:
  pull_request:
    paths:
      - "scripts/renovate/**"
      - "app-families.yaml"
      - "src/**/zarf.yaml"
      - "src/**/tasks.yaml"
      - "scripts/root-ca-retriever/**"
      - ".github/workflows/scripts-test.yaml"
      - "tasks/lint.yaml"
      - "renovate.json"
      - "mise.toml"

concurrency:
  group: scripts-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.script-dir }} Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        script-dir: [renovate, root-ca-retriever]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup-tools

      - name: Install dependencies
        working-directory: scripts/${{ matrix.script-dir }}
        run: npm ci

      - name: Run tests
        working-directory: scripts/${{ matrix.script-dir }}
        run: npm run test

      - name: Validate generated Renovate configuration
        if: matrix.script-dir == 'renovate'
        working-directory: scripts/renovate
        run: npm run test:config
