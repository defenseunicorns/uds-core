name: HA k3d Testing

on:
  schedule:
    # Runs every morning at 2:00 AM UTC
    - cron: "0 2 * * *"
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths:
      - ".github/workflows/test-k3d-ha.yaml"
      - "bundles/k3d-standard/**"
      - "bundles/k3d-standard-next/**"

concurrency:
  group: test-k3d-ha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)

jobs:
  uds-core-ha-upgrade-nightly:
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 60
    name: HA Testing

    strategy:
      matrix:
        flavor: [upstream, registry1, unicorn]
        test-type: [install, upgrade]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}
          installK3d: 'true'

      - name: Set up HA PostgreSQL
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/setup.yaml ha-postgres --no-progress

      - name: Set up HA Redis
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/setup.yaml ha-redis --no-progress

      # Keep these package builds sequential because they share the build directory.
      # Separate steps expose the layer-level timing without changing the task order.
      - name: Build UDS Core HA CRDs package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=crds --no-progress

      - name: Build UDS Core HA base package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=base --with shim_bundle=false --no-progress

      - name: Build UDS Core HA identity-authorization package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=identity-authorization --no-progress

      - name: Build UDS Core HA logging package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=logging --no-progress

      - name: Build UDS Core HA monitoring package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=monitoring --no-progress

      - name: Build UDS Core HA runtime-security package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=runtime-security --no-progress

      - name: Build UDS Core HA backup-restore package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=backup-restore --no-progress

      - name: Build UDS Core HA metrics-server package
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=metrics-server --no-progress

      - name: Build UDS Core HA portal package
        if: ${{ matrix.test-type == 'install' && matrix.flavor != 'registry1' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=portal --no-progress

      - name: Create UDS Core HA bundle
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-bundle-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy UDS Core HA
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-ha-deploy --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Validate UDS Core HA
        if: ${{ matrix.test-type == 'install' }}
        run: uds run -f tasks/test.yaml core-validate --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Set up HA PostgreSQL for upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/setup.yaml ha-postgres --no-progress

      - name: Set up HA Redis for upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/setup.yaml ha-redis --no-progress

      - name: Create latest Core release bundle for HA upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-bundle-release-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy latest Core release for HA upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-bundle-release-deploy --with configFile=bundles/k3d-standard/uds-ha-config.yaml --no-progress

      - name: Clean up latest Core release bundle workspace
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-bundle-release-cleanup --no-progress

      - name: Fetch latest release test resources for HA upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-fetch --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy latest release test resources for HA upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-deploy --no-progress

      - name: Clean up latest release test-resource workspace
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-cleanup --no-progress

      # Keep these package builds sequential because they share the build directory.
      # Separate steps expose the layer-level timing without changing the task order.
      - name: Build UDS Core HA CRDs upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=crds --no-progress

      - name: Build UDS Core HA base upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=base --with shim_bundle=false --no-progress

      - name: Build UDS Core HA identity-authorization upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=identity-authorization --no-progress

      - name: Build UDS Core HA logging upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=logging --no-progress

      - name: Build UDS Core HA monitoring upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=monitoring --no-progress

      - name: Build UDS Core HA runtime-security upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=runtime-security --no-progress

      - name: Build UDS Core HA backup-restore upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=backup-restore --no-progress

      - name: Build UDS Core HA metrics-server upgrade package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=metrics-server --no-progress

      - name: Build UDS Core HA portal upgrade package
        if: ${{ matrix.test-type == 'upgrade' && matrix.flavor != 'registry1' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=portal --no-progress

      - name: Create UDS Core HA upgrade bundle
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-bundle-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy current UDS Core HA for upgrade
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-deploy --set FLAVOR=${{ matrix.flavor }} --with configFile=bundles/k3d-standard-next/config-ha.uds.hcl --with packages=core_crds,core_base,core_identity_authorization,core_logging,core_monitoring,core_runtime_security,core_backup_restore,core_portal,core_metrics_server --no-progress

      - name: Validate upgraded UDS Core HA
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml core-validate --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Set up upgraded HA E2E test user
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-test-user --no-progress

      - name: Create upgraded HA E2E test resource package
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress

      - name: Deploy upgraded HA E2E test resources
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --no-progress

      - name: Validate upgraded HA E2E test resources
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress

      - name: Prepare upgraded HA E2E test CA
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml util:prepare-node-test-ca --no-progress

      - name: Run upgraded HA Playwright E2E tests
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-playwright --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Run upgraded HA Vitest E2E tests
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-vitest --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --with skip_fleet_admin=true --no-progress

      - name: Clean up upgraded HA E2E test resources
        if: ${{ matrix.test-type == 'upgrade' }}
        run: uds run -f tasks/test.yaml e2e-cleanup --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -nightly-${{ matrix.flavor }}-${{ matrix.test-type }}

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
