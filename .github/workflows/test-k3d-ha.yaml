name: HA k3d Testing

on:
  workflow_call:

concurrency:
  group: test-k3d-ha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write # Allows writing to pull requests (needed for renovate-readiness)

jobs:
  uds-core-ha-install:
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 60
    name: HA Testing (${{ matrix.flavor }}, install)
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/')
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}

      - name: Run UDS Core Install HA Test
        run: uds run test-uds-core-ha --set FLAVOR=${{ matrix.flavor }} --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -nightly-${{ matrix.flavor }}-install

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}

  uds-core-ha-upgrade:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release-please') && github.event.pull_request.user.login == 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 60
    name: HA Testing (${{ matrix.flavor }}, upgrade)
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/')
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}

      - name: Pin the latest released baseline
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/pin-released-baseline
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base_ref: ${{ github.base_ref }}

      - name: Start HA services
        run: |
          uds run -f tasks/setup.yaml ha-postgres --no-progress
          uds run -f tasks/setup.yaml ha-redis --no-progress

      - parallel:
          - name: Build candidate bundle
            run: uds run -f tasks/create.yaml k3d-standard-bundle-next --with create_options=--skip-sbom --set FLAVOR=${{ matrix.flavor }} --no-progress

          - name: Deploy released baseline and test resources
            run: |
              uds run -f tasks/deploy.yaml latest-bundle-release --with configFile=bundles/k3d-standard/uds-ha-config.yaml --set FLAVOR=${{ matrix.flavor }} --no-progress
              uds run -f tasks/deploy.yaml latest-release-test-resources --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Upgrade to the prebuilt candidate
        run: uds run -f tasks/test.yaml upgrade-existing --with candidate_bundle_prebuilt=true --with configFile=bundles/k3d-standard-next/config-ha.uds.hcl --set FLAVOR=${{ matrix.flavor }} --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Check HA behavior
        run: uds run -f tasks/test.yaml ha-specific-checks --with prepare_vitest=false --set FLAVOR=${{ matrix.flavor }} --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -nightly-${{ matrix.flavor }}-upgrade

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
