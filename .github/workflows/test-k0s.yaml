name: K0s Test

on:
  schedule:
    - cron: "0 0 * * *"  # Every day at midnight UTC
  pull_request:
    # Milestoning triggers release-please PRs, which GitHub Actions does not trigger on creation.
    types: [milestoned, opened, reopened, synchronize]
    paths:
      - ".github/workflows/test-k0s.yaml"
      - "tasks/setup.yaml"
      - "tasks/deploy.yaml"
      - "tasks/create.yaml"
      - "tasks/test.yaml"
      - "bundles/k3d-standard-next/**"
      - "src/k0s/**"
      - ".release-please-manifest.json"
      - "release-please-config.json"

permissions:
  id-token: write
  contents: read
  packages: read
  pull-requests: write # Needed for renovate-readiness

concurrency:
  group: test-k0s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-k0s-install:
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 60
    name: test-k0s
    env:
      KUBECONFIG: ${{ github.workspace }}/build/k0s/kubeconfig
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/')
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}

      - name: Setup K0s
        run: uds run -f tasks/setup.yaml k0s-test-cluster --no-progress
        timeout-minutes: 15

      - name: Deploy UDS Core
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/deploy.yaml k0s-standard-bundle-next --no-progress --set FLAVOR=${{ matrix.flavor }}
        timeout-minutes: 30

      - name: Test UDS Core
        run: uds run -f tasks/test.yaml uds-core-non-k3d --set FLAVOR=${{ matrix.flavor }} --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }}

      - name: Collect K0s node logs
        if: always()
        timeout-minutes: 3
        run: |
          LOG_DIR="$RUNNER_TEMP/k0s-logs"
          mkdir -p "$LOG_DIR"
          if docker container inspect k0s-uds --format '{{json .State}}' > "$LOG_DIR/container-state.json" 2> "$LOG_DIR/collection-errors.log"; then
            docker logs --timestamps k0s-uds > "$LOG_DIR/k0s.log" 2>&1 || echo "::warning::Could not collect K0s process logs"
            # Read node files directly, including rotated pod logs, even when the Kubernetes API is unavailable.
            docker cp k0s-uds:/var/log/. "$LOG_DIR/node" 2>> "$LOG_DIR/collection-errors.log" || echo "::warning::Could not copy K0s node logs"
          fi

      - name: Upload K0s node logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k0s-node-logs-${{ matrix.flavor }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/k0s-logs
            /tmp/zarf-*.log
            /tmp/uds-*.log
            /tmp/maru-*.log

      - name: Debug Output
        if: always()
        timeout-minutes: 3
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        timeout-minutes: 5
        uses: ./.github/actions/save-logs
        with:
          suffix: -k0s-${{ matrix.flavor }}
          distro: k0s

      - name: Remove K0s
        if: always()
        run: |
          if docker container inspect k0s-uds > /dev/null 2>&1; then
            docker rm -fv k0s-uds
          fi

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
