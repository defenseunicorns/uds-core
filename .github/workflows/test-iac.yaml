name: Filter IaC

on:
  workflow_call:

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  id-token: write # Needed for OIDC-related operations.
  contents: read # Allows reading the content of the repository.
  pull-requests: write # Allows writing pull request metadata.
  packages: read # Allows reading the published GHCR packages

# Default settings for all run commands in the workflow jobs.
defaults:
  run:
    shell: bash -e -o pipefail {0} # Ensures that scripts fail on error and pipefail is set.

# Abort prior jobs on the same commit
concurrency:
  group: test-iac-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Select cloud suites from changed paths, including shared task dependencies.
  check-paths:
    runs-on: ubuntu-latest
    name: Select Jobs
    outputs:
      aks: ${{ steps.cloud-paths.outputs.aks }}
      eks: ${{ steps.cloud-paths.outputs.eks }}
      rke2: ${{ steps.cloud-paths.outputs.rke2 }}
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check renovate readiness
        if: startsWith(github.event.pull_request.head.ref, 'renovate/') # Only call for Renovate PRs
        uses: ./.github/actions/renovate-readiness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select cloud suites from changed paths
        id: cloud-paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/filters/cloud-pr.yaml

  # Trigger IaC
  run-eks-test:
    needs: check-paths
    name: Schedule EKS
    if: ${{ needs.check-paths.outputs.eks == 'true' || contains(github.event.pull_request.labels.*.name, 'test-all-iac') || contains(github.event.pull_request.labels.*.name, 'test-eks') }}
    uses: ./.github/workflows/test-eks.yaml
    with:
      flavor: all
    secrets: inherit

  run-rke2-test:
    needs: check-paths
    name: Schedule RKE2
    if: ${{ needs.check-paths.outputs.rke2 == 'true' || contains(github.event.pull_request.labels.*.name, 'test-all-iac') || contains(github.event.pull_request.labels.*.name, 'test-rke2') }}
    uses: ./.github/workflows/test-rke2.yaml
    with:
      flavor: all
    secrets: inherit

  run-aks-test:
    needs: check-paths
    name: Schedule AKS
    if: ${{ needs.check-paths.outputs.aks == 'true' || contains(github.event.pull_request.labels.*.name, 'test-all-iac') || contains(github.event.pull_request.labels.*.name, 'test-aks') }}
    uses: ./.github/workflows/test-aks.yaml
    with:
      flavor: all
    secrets: inherit
