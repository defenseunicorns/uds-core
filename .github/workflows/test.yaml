name: Test packages

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      package:
        type: string
        description: "The name of the source package to test"
        required: true
      flavor:
        type: string
        description: "Flavor of the source package to test"
        required: true
      test_type:
        type: string
        description: "The type of test to perform"
        required: true
    # Triggered by pull-request-conditionals.yaml
  workflow_call:
    inputs:
      package:
        type: string
        description: "The name of the core package layer to test"
        required: true
      flavor:
        type: string
        description: "Flavor of the source package to test"
        required: true
      test_type:
        type: string
        description: "The type of test to perform"
        required: true

permissions:
  contents: read
  id-token: write # This is needed for OIDC federation.
  packages: read # Allows reading the published GHCR packages

jobs:
  test:
    # Use the 8 core runner for full-core or 4 core runner (with larger disk) for func layers tests
    runs-on: "${{ inputs.package == 'all' && 'uds-ubuntu-big-boy-8-core' || 'uds-ubuntu-big-boy-4-core'}}"
    # Increase the timeout for longer upgrades
    timeout-minutes: ${{ inputs.test_type == 'upgrade' && 60 || 30 }}
    name: Test
    env:
      UDS_LAYER: ${{ inputs.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CI timing
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        env:
          CI_TIMING_JOB_KIND: package-test
          CI_TIMING_PACKAGE: ${{ inputs.package }}
          CI_TIMING_FLAVOR: ${{ inputs.flavor }}
          CI_TIMING_TEST_TYPE: ${{ inputs.test_type }}
        with:
          mode: init

      - name: Start environment setup timing
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: start
          phase: environment-setup

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (inputs.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (inputs.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (inputs.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}
          installK3d: "true"

      - name: End environment setup timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: end
          phase: environment-setup
          status: ${{ job.status }}

      - name: Test a single layer package
        # Guard against portal+registry1 since workflow_dispatch and workflow_call triggers bypass matrix excludes
        if: ${{ inputs.package != 'all' && inputs.test_type == 'install' && !(inputs.package == 'portal' && inputs.flavor == 'registry1') }}
        run: bash .github/actions/ci-timing/timing.sh run test-single-layer uds run test-single-layer --set FLAVOR=${{ inputs.flavor }} --set LAYER=${{ inputs.package }} --no-progress

      - name: Test UDS Core Install
        if: ${{ inputs.package == 'all' && inputs.test_type == 'install' }}
        run: bash .github/actions/ci-timing/timing.sh run test-core-install uds run test:uds-core-e2e --set FLAVOR=${{ inputs.flavor }} --set EXCLUDED_PACKAGES=${{ inputs.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Test UDS Core Upgrade
        if: ${{ inputs.package == 'all' && inputs.test_type == 'upgrade' }}
        run: bash .github/actions/ci-timing/timing.sh run test-core-upgrade uds run test-uds-core-upgrade --set FLAVOR=${{ inputs.flavor }} --set EXCLUDED_PACKAGES=${{ inputs.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Start debug output timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: start
          phase: debug-output

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: End debug output timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: end
          phase: debug-output
          status: ${{ job.status }}

      - name: Start save logs timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: start
          phase: save-logs

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        with:
          suffix: -${{ inputs.test_type }}-${{ inputs.package }}-${{ inputs.flavor }}

      - name: End save logs timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: end
          phase: save-logs
          status: ${{ job.status }}

      - name: Finalize CI timing
        if: ${{ always() }}
        uses: ./.github/actions/ci-timing
        continue-on-error: true
        with:
          mode: finalize
          status: ${{ job.status }}
          artifact_name: ci-timing-package-test-${{ inputs.package }}-${{ inputs.flavor }}-${{ inputs.test_type }}-${{ github.run_id }}-${{ github.run_attempt }}
