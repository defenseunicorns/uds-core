name: CLI Compatibility

on:
  schedule:
    # Runs every morning at 2:00 AM UTC
    - cron: "0 2 * * *"
  pull_request:
    # milestoned is added here as a workaround for release-please not triggering PR workflows (PRs should be added to a milestone to trigger the workflow).
    # labeled is added to support renovate-ready labelling on PRs
    types: [milestoned, labeled, opened, reopened, synchronize]
    paths:
      - ".github/workflows/test-cli-matrix.yaml"
      - "bundles/k3d-standard/**"
      - "bundles/k3d-standard-next/**"

# Abort prior jobs in the same workflow / PR
concurrency:
  group: test-cli-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # This is needed for OIDC federation.
  packages: read # Allows reading the published GHCR packages

jobs:
  cli-upgrade:
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 60
    name: "Test Upgrade (${{ matrix.mode }}, ${{ matrix.scenario }}, ${{ matrix.flavor }})"

    strategy:
      matrix:
        include:
          - mode: legacy
            scenario: legacy-old-old
            flavor: upstream
            install_cli: v0.34.0 # Minimum supported Legacy CLI
            upgrade_cli: v0.34.0
          - mode: legacy
            scenario: legacy-old-new
            flavor: upstream
            install_cli: v0.34.0 # Minimum supported Legacy CLI
            # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
            upgrade_cli: v0.37.0
          - mode: next
            scenario: legacy-to-next
            flavor: upstream
            install_cli: v0.34.0 # Minimum supported Legacy CLI
            upgrade_cli: v0.36.0 # Minimum supported CLI Next version
          # TODO: Uncomment this scenario after the first Next bundle is published.
          # - mode: next
          #   scenario: next-min-to-next-latest
          #   flavor: upstream
          #   install_cli: v0.36.0 # Minimum supported CLI Next version
          #   # renovate: datasource=github-tags depName=defenseunicorns/uds-cli versioning=semver
          #   upgrade_cli: v0.37.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          installK3d: 'true'

      - name: Install CLI for install phase
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: ${{ matrix.install_cli }}

      - name: Print CLI version for debug
        run: uds version

      - name: Create latest release bundle (install phase)
        run: uds run -f tasks/deploy.yaml latest-bundle-release-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy latest release (install phase)
        run: uds run -f tasks/deploy.yaml latest-bundle-release-deploy --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Clean up latest release bundle workspace
        run: uds run -f tasks/deploy.yaml latest-bundle-release-cleanup --no-progress

      - name: Fetch latest release test resources
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-fetch --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy latest release test resources
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-deploy --no-progress

      - name: Clean up latest release test-resource workspace
        run: uds run -f tasks/deploy.yaml latest-release-test-resources-cleanup --no-progress

      - name: Install CLI for upgrade phase
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: ${{ matrix.upgrade_cli }}

      - name: Print CLI version for debug
        run: uds version

      - name: Build Legacy upgrade packages
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-package-build --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Create Legacy upgrade bundle
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-bundle-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy current Core Legacy upgrade
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-upgrade-deploy --set FLAVOR=${{ matrix.flavor }} --with configFile=bundles/k3d-standard/uds-upgrade-test-config.yaml --no-progress

      - name: Validate current Core Legacy upgrade
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-validate --no-progress

      - name: Set up Legacy upgrade E2E test user
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-user --no-progress

      - name: Create Legacy upgrade E2E test resource package
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress

      - name: Deploy Legacy upgrade E2E test resources
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --no-progress

      - name: Validate Legacy upgrade E2E test resources
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress

      - name: Prepare Legacy upgrade E2E test CA
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml util:prepare-node-test-ca --no-progress

      - name: Run Legacy upgrade Playwright tests
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-playwright --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Run Legacy upgrade Vitest tests
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-vitest --with skip_fleet_admin=true --no-progress

      - name: Clean up Legacy upgrade E2E resources
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-cleanup --no-progress

      # Keep these package builds sequential because they share the build directory.
      # Separate steps expose the layer-level timing without changing the task order.
      - name: Build Next CRDs upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=crds --no-progress

      - name: Build Next base upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=base --with shim_bundle=false --no-progress

      - name: Build Next identity-authorization upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=identity-authorization --no-progress

      - name: Build Next logging upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=logging --no-progress

      - name: Build Next monitoring upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=monitoring --no-progress

      - name: Build Next runtime-security upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=runtime-security --no-progress

      - name: Build Next backup-restore upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=backup-restore --no-progress

      - name: Build Next metrics-server upgrade package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=metrics-server --no-progress

      - name: Build Next portal upgrade package
        if: ${{ matrix.mode == 'next' && matrix.flavor != 'registry1' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=${{ matrix.flavor }} --with layer=portal --no-progress

      - name: Create Next upgrade bundle
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-bundle-create --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Deploy current Core Next upgrade
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-deploy --set FLAVOR=${{ matrix.flavor }} --with configFile=bundles/k3d-standard-next/config-upgrade.uds.hcl --with packages=core_crds,core_base,core_identity_authorization,core_logging,core_monitoring,core_runtime_security,core_backup_restore,core_portal,core_metrics_server --no-progress

      - name: Validate current Core Next upgrade
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-validate --no-progress

      - name: Set up Next upgrade E2E test user
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-user --no-progress

      - name: Create Next upgrade E2E test resource package
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress

      - name: Deploy Next upgrade E2E test resources
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --no-progress

      - name: Validate Next upgrade E2E test resources
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress

      - name: Prepare Next upgrade E2E test CA
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml util:prepare-node-test-ca --no-progress

      - name: Run Next upgrade Playwright tests
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-playwright --set FLAVOR=${{ matrix.flavor }} --no-progress

      - name: Run Next upgrade Vitest tests
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-vitest --with skip_fleet_admin=true --no-progress

      - name: Clean up Next upgrade E2E resources
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-cleanup --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -upgrade-matrix-${{ matrix.mode }}-${{ matrix.scenario }}-${{ matrix.flavor }}

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}

  cli-install:
    runs-on: uds-ubuntu-big-boy-8-core
    timeout-minutes: 30
    name: "Test Install (${{ matrix.mode }}, minimum supported, upstream)"

    strategy:
      matrix:
        include:
          - mode: legacy
            cli_version: v0.34.0 # Minimum supported Legacy CLI
          - mode: next
            cli_version: v0.36.0 # Minimum supported CLI Next version

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          installK3d: 'true'

      - name: Install minimum supported CLI
        uses: defenseunicorns/setup-uds@d6add59d4c2ca789ed7c92741e91bd340b4e950b # v1.0.2
        with:
          version: ${{ matrix.cli_version }}

      - name: Print CLI version for debug
        run: uds version

      - name: Build Legacy Core packages (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-package-build --set FLAVOR=upstream --no-progress

      - name: Create Legacy Core bundle (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-bundle-create --set FLAVOR=upstream --no-progress

      - name: Deploy Legacy Core (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-legacy-install-deploy --set FLAVOR=upstream --no-progress

      - name: Validate Legacy Core (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml core-validate --no-progress

      - name: Set up Legacy Core E2E user (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-user --no-progress

      - name: Create Legacy Core E2E resource package (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress

      - name: Deploy Legacy Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --no-progress

      - name: Validate Legacy Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress

      - name: Prepare Legacy Core E2E test CA (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml util:prepare-node-test-ca --no-progress

      - name: Run Legacy Core Playwright tests (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-playwright --set FLAVOR=upstream --no-progress

      - name: Run Legacy Core Vitest tests (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-vitest --no-progress

      - name: Clean up Legacy Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'legacy' }}
        run: uds run -f tasks/test.yaml e2e-cleanup --no-progress

      # Keep these package builds sequential because they share the build directory.
      # Separate steps expose the layer-level timing without changing the task order.
      - name: Build Next CRDs package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=crds --no-progress

      - name: Build Next base package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=base --with shim_bundle=false --no-progress

      - name: Build Next identity-authorization package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=identity-authorization --no-progress

      - name: Build Next logging package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=logging --no-progress

      - name: Build Next monitoring package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=monitoring --no-progress

      - name: Build Next runtime-security package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=runtime-security --no-progress

      - name: Build Next backup-restore package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=backup-restore --no-progress

      - name: Build Next metrics-server package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=metrics-server --no-progress

      - name: Build Next portal package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-package-build-layer --set FLAVOR=upstream --with layer=portal --no-progress

      - name: Create Next Core bundle (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-bundle-create --set FLAVOR=upstream --no-progress

      - name: Deploy Next Core (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-deploy --set FLAVOR=upstream --with configFile=bundles/k3d-standard-next/config-test.uds.hcl --no-progress

      - name: Validate Next Core (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml core-validate --no-progress

      - name: Set up Next Core E2E user (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-user --no-progress

      - name: Create Next Core E2E resource package (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-package-create --no-progress

      - name: Deploy Next Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-deploy --no-progress

      - name: Validate Next Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-test-resource-validate --no-progress

      - name: Prepare Next Core E2E test CA (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml util:prepare-node-test-ca --no-progress

      - name: Run Next Core Playwright tests (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-playwright --set FLAVOR=upstream --no-progress

      - name: Run Next Core Vitest tests (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-vitest --no-progress

      - name: Clean up Next Core E2E resources (minimum supported CLI)
        if: ${{ matrix.mode == 'next' }}
        run: uds run -f tasks/test.yaml e2e-cleanup --no-progress

      - name: Debug Output
        if: ${{ always() }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -install-${{ matrix.mode }}-min-cli-upstream

      - name: Send Slack notification
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/slack-alert
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          channel: ${{ vars.SLACK_ALERT_CHANNEL }}
