name: Publish UDS Core

# Permissions for the GITHUB_TOKEN used by the workflow.
permissions:
  contents: read # Allows reading the content of the repository.
  packages: read # Allows reading the content of the repository's packages.
  id-token: write

on:
  # triggered by tag-and-release.yaml and snapshot-release.yaml
  workflow_call:
    inputs:
      snapshot:
        description: 'true - for snapshot release'
        required: true
        type: boolean

jobs:
  publish-uds-core:
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
    runs-on: "uds-ubuntu-big-boy-8-core"
    name: Publish packages

    permissions:
      contents: read
      packages: write
      id-token: write  # This is needed for OIDC federation.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}
          installK3d: 'true'
          installHcledit: 'true'

      - name: (Snapshot) Get snapshot version using git commit short sha and date
        if: ${{ inputs.snapshot }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          RELEASE_DATE=$(date +'%Y-%m-%d')
          echo "SNAPSHOT_VERSION=${RELEASE_DATE}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "PUBLISH_ARGS=--set VERSION=${RELEASE_DATE}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: (Snapshot) Set versions to snapshot
        if: ${{ inputs.snapshot }}
        run: |
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION), (.packages[]|select(has("ref"))|select(.name=="core")).ref=env(SNAPSHOT_VERSION)' bundles/k3d-standard/uds-bundle.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION), (.packages[]|select(has("ref"))|select(.name=="core-base")).ref=env(SNAPSHOT_VERSION)' bundles/k3d-slim-dev/uds-bundle.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION), (.packages[]|select(has("ref"))|select(.name=="core-identity-authorization")).ref=env(SNAPSHOT_VERSION)' bundles/k3d-slim-dev/uds-bundle.yaml

          for bundle_hcl in bundles/k3d-standard-next/bundle.uds.hcl bundles/k3d-standard-next/bundle-no-portal.uds.hcl bundles/k3d-slim-dev-next/bundle.uds.hcl; do
            hcledit attribute set locals.version "\"${SNAPSHOT_VERSION}\"" --file "${bundle_hcl}" --update
          done

          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/standard/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/crds/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/base/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/identity-authorization/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/logging/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/monitoring/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/runtime-security/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/backup-restore/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/metrics-server/zarf.yaml
          yq -ei '.metadata.version=env(SNAPSHOT_VERSION)' packages/portal/zarf.yaml

      - name: Create amd64 Standard Package
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml standard-package --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create amd64 Legacy Standard Bundle
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml k3d-standard-bundle --no-progress

      - name: Create amd64 Legacy Slim Dev Bundle
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml k3d-slim-dev-bundle --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create arm64 Standard Package
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml standard-package --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create arm64 Legacy Standard Bundle
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml k3d-standard-bundle --no-progress

      - name: Create arm64 Legacy Slim Dev Bundle
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml k3d-slim-dev-bundle --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create amd64 Next Standard packages
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml k3d-standard-bundle-next-packages --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create amd64 Next Standard bundle
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml k3d-standard-bundle-next-bundle --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create amd64 Next Slim Dev Bundle
        if: ${{ matrix.flavor == 'upstream' }}
        run: ZARF_ARCHITECTURE=amd64 uds run -f tasks/create.yaml k3d-slim-dev-bundle-next --no-progress

      - name: Create arm64 Next Standard packages
        if: ${{ matrix.flavor == 'upstream' }}
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml k3d-standard-bundle-next-packages --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create arm64 Next Standard bundle
        if: ${{ matrix.flavor == 'upstream' }}
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml k3d-standard-bundle-next-bundle --no-progress --set FLAVOR=${{ matrix.flavor }}

      - name: Create arm64 Next Slim Dev Bundle
        if: ${{ matrix.flavor == 'upstream' }}
        run: ZARF_ARCHITECTURE=arm64 uds run -f tasks/create.yaml k3d-slim-dev-bundle-next --no-progress

      - name: Deploy amd64 Bundle
        if: ${{ !inputs.snapshot }}
        run: uds run -f tasks/deploy.yaml k3d-standard-bundle-next --set FLAVOR=${{ matrix.flavor }} --with configFile=bundles/k3d-standard-next/config-test.uds.hcl --no-progress

      - name: Validate amd64 Bundle
        if: ${{ !inputs.snapshot }}
        run: uds run -f tasks/test.yaml core-validate --set EXCLUDED_PACKAGES=${{ matrix.flavor == 'registry1' && 'portal' || '' }} --no-progress

      - name: Debug Output
        if: ${{ always() && !inputs.snapshot }}
        uses: ./.github/actions/debug-output

      # Publish package and bundle to destination repository
      - name: Publish Standard Package
        run: uds run -f tasks/publish.yaml standard-package --set FLAVOR=${{ matrix.flavor }} --set SNAPSHOT="${{ inputs.snapshot }}" ${PUBLISH_ARGS} --no-progress

      - name: Publish Upstream Flavored Bundles
        if: ${{ matrix.flavor == 'upstream' }}
        run: uds run -f tasks/publish.yaml bundles --set SNAPSHOT="${{ inputs.snapshot }}" ${PUBLISH_ARGS} --no-progress

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -${{ matrix.flavor }}

  publish-uds-core-layers:
    if: ${{ !inputs.snapshot }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [upstream, registry1, unicorn]
        layer: [crds, base, identity-authorization, runtime-security, backup-restore, logging, metrics-server, monitoring, portal]
        arch: [amd64, arm64]
        exclude:
          - flavor: registry1
            layer: portal
    runs-on: ${{ matrix.arch == 'arm64' && 'uds-ubuntu-24-arm64-4-core' || 'uds-ubuntu-big-boy-4-core' }}
    name: Publish package layers

    permissions:
      contents: read
      packages: write
      id-token: write  # This is needed for OIDC federation.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment setup
        uses: ./.github/actions/setup
        with:
          ghToken: ${{ secrets.GITHUB_TOKEN }}
          registry1Username: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_USERNAME || '' }}
          registry1Password: ${{ (matrix.flavor == 'registry1') && secrets.IRON_BANK_ROBOT_PASSWORD || '' }}
          chainguardIdentity: ${{ (matrix.flavor == 'unicorn') && secrets.CHAINGUARD_IDENTITY || '' }}
          installK3d: 'true'

      - name: Deploy layer test dependencies
        run: uds run -f tasks/publish.yaml single-layer-test-dependencies --set FLAVOR=${{ matrix.flavor }} --set LAYER=${{ matrix.layer }} --no-progress

      - name: Build Core Package Layer
        run: uds run -f tasks/publish.yaml single-layer-build --set FLAVOR=${{ matrix.flavor }} --set LAYER=${{ matrix.layer }} --no-progress

      - name: Deploy Core Package Layer
        run: uds run -f tasks/publish.yaml single-layer-deploy --set FLAVOR=${{ matrix.flavor }} --set LAYER=${{ matrix.layer }} --no-progress

      - name: Validate Core Package Layer
        run: uds run -f tasks/publish.yaml single-layer-validate --set FLAVOR=${{ matrix.flavor }} --set LAYER=${{ matrix.layer }} --no-progress

      - name: Publish Core Package Layer
        run: uds run -f tasks/publish.yaml single-layer-publish --set FLAVOR=${{ matrix.flavor }} --set LAYER=${{ matrix.layer }} --no-progress

      - name: Debug Output
        if: ${{ always() && !inputs.snapshot }}
        uses: ./.github/actions/debug-output

      - name: Save logs
        if: always()
        uses: ./.github/actions/save-logs
        continue-on-error: true
        with:
          suffix: -${{ matrix.flavor }}-${{ matrix.layer }}-${{ matrix.arch }}
