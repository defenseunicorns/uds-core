name: AKS Test

on:
  workflow_call: {}

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup cancelled Central US run
    steps:
      - name: Verify cancelled run is terminal
        run: |
          test "$(curl --fail --silent --show-error https://api.github.com/repos/defenseunicorns/uds-core/actions/runs/36733138824 | jq -r .status)" = completed

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove only abandoned run resources
        run: |
          for group in uds-ci-upstream-dacg uds-ci-upstream-2fd5dce-dacg-managed-rg; do
            if [ "$(az group exists --name "$group")" = true ]; then
              test "$(az group show --name "$group" --query location -o tsv)" = centralus
              az group delete --name "$group" --yes
            fi
            test "$(az group exists --name "$group")" = false
            echo "Verified removed: $group"
          done

      - name: Release only the cancelled run state lease
        env:
          STATE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
          STATE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
        run: |
          test "$(curl --fail --silent --show-error https://api.github.com/repos/defenseunicorns/uds-core/actions/runs/36733138824 | jq -r .status)" = completed
          state_key=uds-core/2fd5dce-nightly-aks-core-upstream.tfstate
          lease=$(az storage blob show --account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" --name "$state_key" --auth-mode login --query properties.lease.status -o tsv)
          if [ "$lease" = locked ]; then
            az storage blob lease break --account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" --blob-name "$state_key" --auth-mode login --lease-break-period 0 -o none
          fi
          test "$(az storage blob show --account-name "$STATE_ACCOUNT" --container-name "$STATE_CONTAINER" --name "$state_key" --auth-mode login --query properties.lease.status -o tsv)" = unlocked
          echo "Verified cancelled run state lease is unlocked"
