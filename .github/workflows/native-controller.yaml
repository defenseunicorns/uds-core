name: Native controller

on:
  pull_request:
    paths:
      - .github/workflows/native-controller.yaml
      - .github/actions/setup-tools/**
      - mise.toml
      - package.json
      - package-lock.json
      - src/go-controller/**
      - src/pepr/**
      - src/keycloak/chart/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-controller.yaml
      - .github/actions/setup-tools/**
      - mise.toml
      - package.json
      - package-lock.json
      - src/go-controller/**
      - src/pepr/**
      - src/keycloak/chart/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: ./.github/actions/setup-tools

      - name: Install controller SDK and locked JavaScript dependencies
        run: |
          mise install go@1.27.1
          npm ci --ignore-scripts

      - name: Race tests and vet
        run: |
          mise exec go@1.27.1 -- go -C src/go-controller test -race ./...
          mise exec go@1.27.1 -- go -C src/go-controller vet ./...

      - name: Verify Package admission against current Pepr specifications
        run: |
          node node_modules/vitest/vitest.mjs run src/go-controller/native-admission/reference/capture-package-parity.spec.ts
          git diff --exit-code -- src/go-controller/internal/admission/resources/testdata/package-parity.json

      - name: Verify generated API and clients
        run: |
          mise exec go@1.27.1 -- node src/go-controller/hack/generate-api.mjs
          mise exec go@1.27.1 -- bash src/go-controller/hack/update-codegen.sh
          git diff --exit-code -- src/go-controller/api src/go-controller/client

      - name: Verify chart and admission contracts
        run: |
          untt src/go-controller/chart
          untt src/keycloak/chart
          validation_dir=$(mktemp -d)
          trap 'rm -rf "$validation_dir"' EXIT
          uds zarf tools helm template uds-controller src/go-controller/chart \
            --namespace uds-system --kube-version 1.37.1 > "$validation_dir/broad.yaml"
          node src/go-controller/native-admission/check-render.mjs "$validation_dir/broad.yaml"
          uds zarf tools helm template uds-controller src/go-controller/chart \
            --namespace uds-system --kube-version 1.37.1 \
            --set nativeAdmission.narrowCallbacks=true > "$validation_dir/narrow.yaml"
          node src/go-controller/native-admission/check-render.mjs "$validation_dir/narrow.yaml" narrow
