name: save-logs
description: "Save debug logs"

inputs:
  suffix:
    description: "Suffix to append to the debug log"
    required: false
    default: ""
  distro:
    description: "Kubernetes distribution used in this CI run"
    required: false
    default: "k3d"
  resource_group:
    description: "Azure resource group name (required for AKS log collection)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Start containerd log timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-containerd
    - name: Pull logs from containerd
      id: pull_containerd_logs
      if: ${{ inputs.distro == 'k3d' }}
      run: |
        CONTAINER_NAME="k3d-uds-server-0"
        if docker ps | grep -q "$CONTAINER_NAME"; then
          echo "Container $CONTAINER_NAME is running. Proceeding with log copy..."
          docker cp ${CONTAINER_NAME}:/var/log/ /tmp/uds-containerd-logs
        else
          echo "Container $CONTAINER_NAME is not running. Skipping log copy."
        fi
      shell: bash
    - name: End containerd log timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-containerd
        status: ${{ steps.pull_containerd_logs.outcome }}

    - name: Start node log timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-node
    - name: Dump Node Logs
      id: dump_node_logs
      if: ${{ inputs.distro == 'k3d' }}
      run: |
        docker ps --filter "name=k3d" --format "{{.Names}}" | while read line; do
          docker logs "$line" 2> /tmp/$line.log
        done
      shell: bash
    - name: End node log timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-node
        status: ${{ steps.dump_node_logs.outcome }}

    - name: Start log permission timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-permissions
    - name: Fix log permissions
      id: fix_log_permissions
      run: |
        sudo chown $USER /tmp/zarf-*.log || echo ""
        sudo chown $USER /tmp/uds-*.log || echo ""
      shell: bash
    - name: End log permission timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-permissions
        status: ${{ steps.fix_log_permissions.outcome }}

    - name: Start Playwright artifact timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-playwright
    - name: Move Playwright Artifacts
      id: move_playwright_artifacts
      run: |
        sudo mkdir -p /tmp/playwright
        sudo mv test/playwright/.playwright/* /tmp/playwright || true
      shell: bash
    - name: End Playwright artifact timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-playwright
        status: ${{ steps.move_playwright_artifacts.outcome }}

    # Loop over all pods and use kubectl logs since we don't have the same direct node access as k3d
    - name: Start pod log timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' && inputs.distro != 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-pods
    - name: Cluster Pod Logs
      id: cluster_pod_logs
      if: ${{ inputs.distro != 'k3d' }}
      run: |
        echo "::group::Collecting logs for all pods"
        mkdir -p /tmp/pod-logs
        # Loop over all pods and grab current and previous logs (8x parallel processes for efficiency)
        uds zarf tools kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | xargs -P 8 -n 2 bash -c '
            ns="$1"; pod="$2"
            base="/tmp/pod-logs/${ns}-${pod}"
            uds zarf tools kubectl logs --all-containers=true -n "$ns" "$pod" --tail=-1 > "${base}.log" 2>&1 || true
            uds zarf tools kubectl logs --all-containers=true -n "$ns" "$pod" --previous --tail=-1 > "${base}-previous.log" 2>&1 || true
          ' _
        echo "::endgroup::"
      shell: bash
    - name: End pod log timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' && inputs.distro != 'k3d' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-pods
        status: ${{ steps.cluster_pod_logs.outcome }}

    - name: Start AKS control plane log timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'aks' && inputs.resource_group != '' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-aks
    - name: AKS Control Plane Logs
      id: aks_control_plane_logs
      if: ${{ inputs.distro == 'aks' && inputs.resource_group != '' }}
      run: |
        echo "::group::Collecting AKS control plane logs"
        mkdir -p /tmp/control-plane-logs

        # Find the Log Analytics workspace in the resource group
        WORKSPACE_ERR=$(mktemp)
        WORKSPACE_ID=$(az monitor log-analytics workspace list \
          --resource-group "${{ inputs.resource_group }}" \
          --query "[0].customerId" -o tsv 2>"$WORKSPACE_ERR") || true

        if [ -z "$WORKSPACE_ID" ]; then
          echo "::warning::Failed to find Log Analytics workspace in ${{ inputs.resource_group }}: $(cat "$WORKSPACE_ERR" || echo 'no workspace exists')"
        else
          echo "Found workspace: $WORKSPACE_ID"

          # One file per control plane component for easy triage.
          for cat in kube-apiserver kube-controller-manager kube-scheduler cloud-controller-manager kube-audit; do
            az monitor log-analytics query \
              --workspace "$WORKSPACE_ID" \
              --analytics-query "AzureDiagnostics | where TimeGenerated > ago(3h) | where Category == '$cat' | order by TimeGenerated desc | take 50000" \
              --output json \
              > /tmp/control-plane-logs/$cat.json \
              2> /tmp/control-plane-logs/$cat.err \
              || {
                echo "::warning::Failed to query $cat logs from Log Analytics: $(cat /tmp/control-plane-logs/$cat.err || true)"
                rm -f /tmp/control-plane-logs/$cat.json
              }
          done

          # Summary stats for quick triage (1-minute bins).
          az monitor log-analytics query \
            --workspace "$WORKSPACE_ID" \
            --analytics-query "
              AzureDiagnostics
              | where TimeGenerated > ago(3h)
              | summarize
                  total_events = count(),
                  apiserver_events = countif(Category == 'kube-apiserver'),
                  etcd_dns_errors = countif(Category == 'kube-apiserver' and log_s has 'lookup etcd'),
                  webhook_rst = countif(log_s has 'connection reset by peer' and log_s has 'webhook'),
                  throttle_429 = countif(log_s has '\"code\":429'),
                  server_5xx = countif(log_s has_any ('\"code\":500', '\"code\":502', '\"code\":503', '\"code\":504'))
                  by bin(TimeGenerated, 1m)
              | order by TimeGenerated desc
            " \
            --output json \
            > /tmp/control-plane-logs/summary-stats.json \
            2> /tmp/control-plane-logs/summary-stats.err \
            || {
              echo "::warning::Failed to query summary stats from Log Analytics: $(cat /tmp/control-plane-logs/summary-stats.err || true)"
              rm -f /tmp/control-plane-logs/summary-stats.json
            }
        fi
        echo "::endgroup::"
      shell: bash
    - name: End AKS control plane log timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' && inputs.distro == 'aks' && inputs.resource_group != '' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-aks
        status: ${{ steps.aks_control_plane_logs.outcome }}

    - name: Start log artifact upload timing
      if: ${{ env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: start
        phase: save-logs-upload
    - id: upload_debug_logs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: debug-log${{ inputs.suffix }}
        retention-days: 7
        path: |
          /tmp/zarf-*.log
          /tmp/uds-*.log
          /tmp/maru-*.log
          /tmp/debug-*.log
          /tmp/pod-logs
          /tmp/control-plane-logs
          /tmp/uds-containerd-logs
          /tmp/k3d-uds-*.log
          /tmp/playwright/output
          /tmp/playwright/reports
    - name: End log artifact upload timing
      if: ${{ always() && env.CI_TIMING_ENABLED == 'true' }}
      uses: ./.github/actions/ci-timing
      continue-on-error: true
      with:
        mode: end
        phase: save-logs-upload
        status: ${{ steps.upload_debug_logs.outcome }}
