# action.yml
name: "Setup Tools"
description: "Installs development tooling from mise.toml"

runs:
  using: "composite"
  steps:
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # renovate: datasource=github-releases depName=jdx/mise versioning=semver
        version: 2026.9.7
        install: true
        cache: true

    - name: Install tools with mise
      run: mise install
      shell: bash
