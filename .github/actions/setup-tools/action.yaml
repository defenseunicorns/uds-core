# action.yml
name: "Setup Tools"
description: "Installs development tooling from mise.toml"

runs:
  using: "composite"
  steps:
    - name: Setup mise
      # renovate: datasource=github-tags depName=jdx/mise-action versioning=semver
      uses: jdx/mise-action@v4.2.4
      with:
        install: false

    - name: Install tools with mise
      run: mise install
      shell: bash
