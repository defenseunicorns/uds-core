name: Check nightly coverage
description: Run a suite when this commit has no recent passing result

inputs:
  token:
    description: Token with checks read access
    required: true
  check_name:
    description: Name of the suite's completed result check
    required: true
  heartbeat_days:
    description: Maximum age of a passing result
    required: false
    default: "7"
  force:
    description: Run regardless of previous results
    required: false
    default: "false"

outputs:
  run:
    description: Whether the suite needs testing
    value: ${{ steps.coverage.outputs.run }}

runs:
  using: composite
  steps:
    - name: Check previous test result
      id: coverage
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        CHECK_NAME: ${{ inputs.check_name }}
        HEARTBEAT_DAYS: ${{ inputs.heartbeat_days }}
        FORCE_RUN: ${{ inputs.force }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          if (process.env.FORCE_RUN === 'true') {
            core.setOutput('run', 'true');
            return;
          }
          try {
            const { data } = await github.rest.checks.listForRef({
              ...context.repo,
              ref: context.sha,
              check_name: process.env.CHECK_NAME,
              filter: 'all',
              per_page: 100,
            });
            const completed = data.check_runs
              .filter(check => check.name === process.env.CHECK_NAME &&
                check.conclusion && check.conclusion !== 'skipped' && check.completed_at)
              .sort((a, b) => Date.parse(b.completed_at) - Date.parse(a.completed_at) || b.id - a.id);
            const latest = completed[0];
            const maxAge = Number(process.env.HEARTBEAT_DAYS) * 86400000;
            const run = !latest || latest.conclusion !== 'success' ||
              Date.now() - Date.parse(latest.completed_at) >= maxAge;
            core.setOutput('run', String(run));
            core.info(`${process.env.CHECK_NAME}: ${run ? 'run' : 'skip'}`);
          } catch (error) {
            core.warning(`Could not read previous check: ${error.message}`);
            core.setOutput('run', 'true');
          }
