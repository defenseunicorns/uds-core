kube-prometheus-stack:
  uds-prometheus-config:
    rke2CorednsNetpol:
      enabled: true

grafana:
  grafana:
    sidecar:
      dashboards:
        logLevel: DEBUG
      datasources:
        logLevel: DEBUG
    autoscaling:
      enabled: {{.vars.core_monitoring.grafana_ha}}
  uds-grafana-config:
    postgresql:
      host: "{{ .vars.core_monitoring.grafana_pg_host }}"
      port: {{.vars.core_monitoring.grafana_pg_port}}
      database: "{{ .vars.core_monitoring.grafana_pg_database }}"
      password: "{{ .vars.core_monitoring.grafana_pg_password }}"
      user: "{{ .vars.core_monitoring.grafana_pg_user }}"
