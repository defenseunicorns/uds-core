istio-controlplane:
  uds-global-istio-config:
    classificationBanners:
      - text: "SAMPLE BANNER"
        enabledHosts:
          - "sso.uds.dev"
        pathPrefixes:
          - "/realms/uds/account"
      - text: "UNKNOWN"
        addFooter: false
        enabledHosts:
          - "grafana.admin.uds.dev"
      - text: "UNCLASSIFIED"
        cssOnly: true
        enabledHosts:
          - "portal.uds.dev"

envoy-gateway:
  uds-envoy-gateway-config:
    envoyService:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

istio-admin-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        service.beta.kubernetes.io/aws-load-balancer-target-node-labels: "kubernetes.io/os=linux"

istio-tenant-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        service.beta.kubernetes.io/aws-load-balancer-target-node-labels: "kubernetes.io/os=linux"
