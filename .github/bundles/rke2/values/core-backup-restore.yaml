velero:
  velero:
    credentials:
      useSecret: {{.vars.core_backup_restore.velero_use_secret}}
    serviceAccount:
      server:
        annotations:
          irsa/role-arn: "{{ .vars.core_backup_restore.velero_irsa_role_arn }}"
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: "{{ .vars.velero_bucket }}"
          config:
            region: "{{ .vars.velero_bucket_region }}"
            s3ForcePathStyle: true
            s3Url: "{{ .vars.velero_bucket_provider_url }}"
