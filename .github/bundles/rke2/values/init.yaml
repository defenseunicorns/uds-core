# Preserve Zarf's default agent behavior during bundle package deployment.
agent:
  mutationPolicy: all

zarf-registry:
  docker-registry:
    affinity:
      custom: {{printf "%q" .vars.init.registry_affinity_custom_uds}}
    persistence:
      accessMode: "{{ .vars.init.registry_pvc_access_mode }}"

zarf-seed-registry:
  docker-registry:
    affinity:
      custom: {{printf "%q" .vars.init.registry_affinity_custom_uds}}
    persistence:
      accessMode: "{{ .vars.init.registry_pvc_access_mode }}"
