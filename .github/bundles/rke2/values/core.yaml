istio-controlplane:
  uds-global-istio-config:
    classificationBanners:
      - text: "SAMPLE BANNER"
        enabledHosts:
          - "sso.uds.dev"
        pathPrefixes:
          - "/realms/uds/account"
      - text: "UNKNOWN"
        addFooter: false
        enabledHosts:
          - "grafana.admin.uds.dev"
      - text: "UNCLASSIFIED"
        enabledHosts:
          - "portal.uds.dev"

envoy-gateway:
  uds-envoy-gateway-config:
    envoyService:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

istio-admin-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        service.beta.kubernetes.io/aws-load-balancer-target-node-labels: "kubernetes.io/os=linux"

istio-tenant-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        service.beta.kubernetes.io/aws-load-balancer-target-node-labels: "kubernetes.io/os=linux"

kube-prometheus-stack:
  uds-prometheus-config:
    rke2CorednsNetpol:
      enabled: true

velero:
  velero:
    credentials:
      useSecret: {{.vars.core.velero_use_secret}}
    serviceAccount:
      server:
        annotations:
          irsa/role-arn: "{{ .vars.core.velero_irsa_role_arn }}"
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: "{{ .vars.velero_bucket }}"
          config:
            region: "{{ .vars.velero_bucket_region }}"
            s3ForcePathStyle: true
            s3Url: "{{ .vars.velero_bucket_provider_url }}"

loki:
  loki:
    loki:
      storage:
        bucketNames:
          chunks: "{{ .vars.core.loki_chunks_bucket }}"
          admin: "{{ .vars.core.loki_admin_bucket }}"
        s3:
          endpoint: ""
          secretAccessKey: ""
          accessKeyId: ""
          region: "{{ .vars.core.loki_s3_region }}"
    global:
      dnsService: rke2-coredns-rke2-coredns
    serviceAccount:
      annotations:
        irsa/role-arn: "{{ .vars.core.loki_irsa_role_arn }}"
    sidecar:
      rules:
        logLevel: DEBUG

grafana:
  grafana:
    sidecar:
      dashboards:
        logLevel: DEBUG
      datasources:
        logLevel: DEBUG
    autoscaling:
      enabled: {{.vars.core.grafana_ha}}
  uds-grafana-config:
    postgresql:
      host: "{{ .vars.core.grafana_pg_host }}"
      port: {{.vars.core.grafana_pg_port}}
      database: "{{ .vars.core.grafana_pg_database }}"
      password: "{{ .vars.core.grafana_pg_password }}"
      user: "{{ .vars.core.grafana_pg_user }}"

keycloak:
  keycloak:
    devMode: false
    autoscaling:
      enabled: true
    detailedObservability:
      alerts:
        enabled: true
    realmInitEnv:
      FLEET_CLIENT_ENABLED: "true"
    postgresql:
      host: "{{ .vars.core.keycloak_db_host }}"
      username: "{{ .vars.core.keycloak_db_username }}"
      database: "{{ .vars.core.keycloak_db_database }}"
      password: "{{ .vars.core.keycloak_db_password }}"

falco:
  uds-falco-config:
    sandboxRulesEnabled: true
    incubatingRulesEnabled: true
