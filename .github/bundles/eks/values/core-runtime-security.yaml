falco:
  uds-falco-config:
    sandboxRulesEnabled: {{.vars.core_runtime_security.falco_sandbox_rules_enabled}}
    incubatingRulesEnabled: {{.vars.core_runtime_security.falco_incubating_rules_enabled}}
    overrides:
      rules:
        "Mount Launched in Privileged Container":
          exceptions:
            action: append
            items:
              - name: allow_csi_efs_node_mounts
                fields: [k8s.ns.name, k8s.pod.name, proc.name]
                comps: [=, startswith, =]
                values:
                  - [kube-system, efs-csi-node-, mount]
              - name: allow_csi_ebs_node_mounts
                fields: [k8s.ns.name, k8s.pod.name, proc.name]
                comps: [=, startswith, =]
                values:
                  - [kube-system, ebs-csi-node, mount]
