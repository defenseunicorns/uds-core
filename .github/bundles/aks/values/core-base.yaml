istio-controlplane:
  uds-global-istio-config:
    classificationBanners:
      - text: "SAMPLE BANNER"
        enabledHosts:
          - "sso.uds.dev"
        pathPrefixes:
          - "/realms/uds/account"
      - text: "UNKNOWN"
        addFooter: false
        enabledHosts:
          - "grafana.admin.uds.dev"
      - text: "UNCLASSIFIED"
        cssOnly: true
        enabledHosts:
          - "portal.uds.dev"

istio-admin-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "false"
        service.beta.kubernetes.io/azure-load-balancer-sku: "Standard"
        service.beta.kubernetes.io/azure-load-balancer-resource-group: "{{ .vars.core_base.node_resource_group_name }}"

istio-tenant-gateway:
  gateway:
    service:
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "false"
        service.beta.kubernetes.io/azure-load-balancer-sku: "Standard"
        service.beta.kubernetes.io/azure-load-balancer-resource-group: "{{ .vars.core_base.node_resource_group_name }}"
