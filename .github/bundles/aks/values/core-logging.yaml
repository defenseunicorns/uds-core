loki:
  loki:
    loki:
      storage:
        type: "azure"
      storage_config:
        azure:
          account_name: "{{ .vars.core_logging.azure_loki_storage_account }}"
          account_key: "{{ .vars.core_logging.azure_loki_storage_account_access_key }}"
          container_name: "{{ .vars.core_logging.azure_loki_storage_account_container }}"
    sidecar:
      rules:
        logLevel: DEBUG
