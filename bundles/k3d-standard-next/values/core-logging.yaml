{{- $lokiChunksBucket := index .vars "loki_chunks_bucket" }}
{{- $lokiRulerBucket := index .vars "loki_ruler_bucket" }}
{{- $lokiAdminBucket := index .vars "loki_admin_bucket" }}
{{- $lokiS3Endpoint := index .vars "loki_s3_endpoint" }}
{{- $lokiS3Region := index .vars "loki_s3_region" }}
{{- $lokiS3AccessKeyID := index .vars "loki_s3_access_key_id" }}
{{- $lokiS3SecretAccessKey := index .vars "loki_s3_secret_access_key" }}
{{- $lokiChunksBucketSet := ne (printf "%v" $lokiChunksBucket) "<no value>" }}
{{- $lokiRulerBucketSet := ne (printf "%v" $lokiRulerBucket) "<no value>" }}
{{- $lokiAdminBucketSet := ne (printf "%v" $lokiAdminBucket) "<no value>" }}
{{- $lokiS3EndpointSet := ne (printf "%v" $lokiS3Endpoint) "<no value>" }}
{{- $lokiS3RegionSet := ne (printf "%v" $lokiS3Region) "<no value>" }}
{{- $lokiS3AccessKeyIDSet := ne (printf "%v" $lokiS3AccessKeyID) "<no value>" }}
{{- $lokiS3SecretAccessKeySet := ne (printf "%v" $lokiS3SecretAccessKey) "<no value>" }}

loki:
  loki:
    write:
      replicas: {{ .vars.loki_write_replicas }}
    read:
      replicas: {{ .vars.loki_read_replicas }}
    backend:
      replicas: {{ .vars.loki_backend_replicas }}
{{- if or $lokiChunksBucketSet $lokiRulerBucketSet $lokiAdminBucketSet $lokiS3EndpointSet $lokiS3RegionSet $lokiS3AccessKeyIDSet $lokiS3SecretAccessKeySet }}
    storage:
{{- if or $lokiChunksBucketSet $lokiRulerBucketSet $lokiAdminBucketSet }}
      bucketNames:
{{- if $lokiChunksBucketSet }}
        chunks: {{ printf "%q" $lokiChunksBucket }}
{{- end }}
{{- if $lokiRulerBucketSet }}
        ruler: {{ printf "%q" $lokiRulerBucket }}
{{- end }}
{{- if $lokiAdminBucketSet }}
        admin: {{ printf "%q" $lokiAdminBucket }}
{{- end }}
{{- end }}
{{- if or $lokiS3EndpointSet $lokiS3RegionSet $lokiS3AccessKeyIDSet $lokiS3SecretAccessKeySet }}
      s3:
{{- if $lokiS3EndpointSet }}
        endpoint: {{ printf "%q" $lokiS3Endpoint }}
{{- end }}
{{- if $lokiS3RegionSet }}
        region: {{ printf "%q" $lokiS3Region }}
{{- end }}
{{- if $lokiS3AccessKeyIDSet }}
        accessKeyId: {{ printf "%q" $lokiS3AccessKeyID }}
{{- end }}
{{- if $lokiS3SecretAccessKeySet }}
        secretAccessKey: {{ printf "%q" $lokiS3SecretAccessKey }}
{{- end }}
{{- end }}
{{- end }}
