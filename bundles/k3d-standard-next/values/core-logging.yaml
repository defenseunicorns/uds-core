{{- $lokiBucketConfigured := or .vars.loki_chunks_bucket .vars.loki_ruler_bucket .vars.loki_admin_bucket }}
{{- $lokiS3Configured := or .vars.loki_s3_endpoint .vars.loki_s3_region }}

loki:
  loki:
    write:
      replicas: {{ .vars.loki_write_replicas }}
    read:
      replicas: {{ .vars.loki_read_replicas }}
    backend:
      replicas: {{ .vars.loki_backend_replicas }}
{{- if or $lokiBucketConfigured $lokiS3Configured }}
    storage:
{{- if $lokiBucketConfigured }}
      bucketNames:
{{- with .vars.loki_chunks_bucket }}
        chunks: {{ printf "%q" . }}
{{- end }}
{{- with .vars.loki_ruler_bucket }}
        ruler: {{ printf "%q" . }}
{{- end }}
{{- with .vars.loki_admin_bucket }}
        admin: {{ printf "%q" . }}
{{- end }}
{{- end }}
{{- if $lokiS3Configured }}
      s3:
{{- with .vars.loki_s3_endpoint }}
        endpoint: {{ printf "%q" . }}
{{- end }}
{{- with .vars.loki_s3_region }}
        region: {{ printf "%q" . }}
{{- end }}
        accessKeyId: {{ printf "%q" .vars.loki_s3_access_key_id }}
        secretAccessKey: {{ printf "%q" .vars.loki_s3_secret_access_key }}
{{- end }}
{{- end }}
