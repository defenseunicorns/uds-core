{{- $lokiChunksBucketSet := hasKey .vars "loki_chunks_bucket" }}
{{- $lokiRulerBucketSet := hasKey .vars "loki_ruler_bucket" }}
{{- $lokiAdminBucketSet := hasKey .vars "loki_admin_bucket" }}
{{- $lokiS3EndpointSet := hasKey .vars "loki_s3_endpoint" }}
{{- $lokiS3RegionSet := hasKey .vars "loki_s3_region" }}
{{- $lokiS3AccessKeyIDSet := hasKey .vars "loki_s3_access_key_id" }}
{{- $lokiS3SecretAccessKeySet := hasKey .vars "loki_s3_secret_access_key" }}

loki:
  loki:
    write:
      replicas: {{ .vars.loki_write_replicas }}
    read:
      replicas: {{ .vars.loki_read_replicas }}
    backend:
      replicas: {{ .vars.loki_backend_replicas }}
{{- if or $lokiChunksBucketSet $lokiRulerBucketSet $lokiAdminBucketSet $lokiS3EndpointSet $lokiS3RegionSet $lokiS3AccessKeyIDSet $lokiS3SecretAccessKeySet }}
    storage:
{{- if or $lokiChunksBucketSet $lokiRulerBucketSet $lokiAdminBucketSet }}
      bucketNames:
{{- if $lokiChunksBucketSet }}
        chunks: {{ printf "%q" (index .vars "loki_chunks_bucket") }}
{{- end }}
{{- if $lokiRulerBucketSet }}
        ruler: {{ printf "%q" (index .vars "loki_ruler_bucket") }}
{{- end }}
{{- if $lokiAdminBucketSet }}
        admin: {{ printf "%q" (index .vars "loki_admin_bucket") }}
{{- end }}
{{- end }}
{{- if or $lokiS3EndpointSet $lokiS3RegionSet $lokiS3AccessKeyIDSet $lokiS3SecretAccessKeySet }}
      s3:
{{- if $lokiS3EndpointSet }}
        endpoint: {{ printf "%q" (index .vars "loki_s3_endpoint") }}
{{- end }}
{{- if $lokiS3RegionSet }}
        region: {{ printf "%q" (index .vars "loki_s3_region") }}
{{- end }}
{{- if $lokiS3AccessKeyIDSet }}
        accessKeyId: {{ printf "%q" (index .vars "loki_s3_access_key_id") }}
{{- end }}
{{- if $lokiS3SecretAccessKeySet }}
        secretAccessKey: {{ printf "%q" (index .vars "loki_s3_secret_access_key") }}
{{- end }}
{{- end }}
{{- end }}
