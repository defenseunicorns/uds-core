loki:
  loki:
    write:
      replicas: {{ .vars.loki_write_replicas }}
    read:
      replicas: {{ .vars.loki_read_replicas }}
    backend:
      replicas: {{ .vars.loki_backend_replicas }}
{{- if or (index .vars "loki_chunks_bucket") (index .vars "loki_ruler_bucket") (index .vars "loki_admin_bucket") (index .vars "loki_s3_endpoint") (index .vars "loki_s3_region") (index .vars "loki_s3_access_key_id") (index .vars "loki_s3_secret_access_key") }}
    storage:
{{- if or (index .vars "loki_chunks_bucket") (index .vars "loki_ruler_bucket") (index .vars "loki_admin_bucket") }}
      bucketNames:
{{- with index .vars "loki_chunks_bucket" }}
        chunks: "{{ . }}"
{{- end }}
{{- with index .vars "loki_ruler_bucket" }}
        ruler: "{{ . }}"
{{- end }}
{{- with index .vars "loki_admin_bucket" }}
        admin: "{{ . }}"
{{- end }}
{{- end }}
{{- if or (index .vars "loki_s3_endpoint") (index .vars "loki_s3_region") (index .vars "loki_s3_access_key_id") (index .vars "loki_s3_secret_access_key") }}
      s3:
{{- with index .vars "loki_s3_endpoint" }}
        endpoint: "{{ . }}"
{{- end }}
{{- with index .vars "loki_s3_region" }}
        region: "{{ . }}"
{{- end }}
{{- with index .vars "loki_s3_access_key_id" }}
        accessKeyId: "{{ . }}"
{{- end }}
{{- with index .vars "loki_s3_secret_access_key" }}
        secretAccessKey: {{ printf "%q" . }}
{{- end }}
{{- end }}
{{- end }}
