authservice:
  authservice:
    replicaCount: {{ .vars.AUTHSERVICE_REPLICA_COUNT }}

keycloak:
  keycloak:
{{- with index .vars "INSECURE_ADMIN_PASSWORD_GENERATION" }}
    insecureAdminPasswordGeneration:
      enabled: {{ . }}
{{- end }}
{{- with index .vars "KEYCLOAK_HA" }}
    autoscaling:
      enabled: {{ . }}
{{- end }}
{{- with index .vars "KEYCLOAK_DEVMODE" }}
    devMode: {{ . }}
{{- end }}
{{- if or (index .vars "KEYCLOAK_PG_USERNAME") (index .vars "KEYCLOAK_PG_PASSWORD") (index .vars "KEYCLOAK_PG_DATABASE") (index .vars "KEYCLOAK_PG_HOST") }}
    postgresql:
{{- with index .vars "KEYCLOAK_PG_USERNAME" }}
      username: "{{ . }}"
{{- end }}
{{- with index .vars "KEYCLOAK_PG_PASSWORD" }}
      password: {{ printf "%q" . }}
{{- end }}
{{- with index .vars "KEYCLOAK_PG_DATABASE" }}
      database: "{{ . }}"
{{- end }}
{{- with index .vars "KEYCLOAK_PG_HOST" }}
      host: "{{ . }}"
{{- end }}
{{- end }}
{{- with index .vars "KEYCLOAK_EXTRA_VOLUME_MOUNTS" }}
    extraVolumeMounts:
{{- range . }}
      - name: "{{ .name }}"
        mountPath: "{{ .mountPath }}"
{{- if .subPath }}
        subPath: "{{ .subPath }}"
{{- end }}
{{- if .readOnly }}
        readOnly: {{ .readOnly }}
{{- end }}
{{- end }}
{{- end }}
{{- with index .vars "KEYCLOAK_EXTRA_VOLUMES" }}
    extraVolumes:
{{- range . }}
      - name: "{{ .name }}"
{{- if .configMap }}
        configMap:
          name: "{{ .configMap.name }}"
{{- if .configMap.optional }}
          optional: {{ .configMap.optional }}
{{- end }}
{{- end }}
{{- if .secret }}
        secret:
          secretName: "{{ .secret.secretName }}"
{{- end }}
{{- end }}
{{- end }}
{{- with index .vars "KEYCLOAK_TRUSTSTORE_PATHS" }}
    truststorePaths:
{{- range . }}
      - "{{ . }}"
{{- end }}
{{- end }}
{{- with index .vars "KEYCLOAK_CUSTOM_TERMS_AND_CONDITIONS" }}
{{- if ne . "" }}
    themeCustomizations:
      termsAndConditions:
        text:
          inline: {{ printf "%q" . }}
{{- end }}
{{- end }}
    detailedObservability:
      alerts:
        enabled: true
    realmInitEnv:
      FLEET_CLIENT_ENABLED: "true"
      GOOGLE_IDP_ENABLED: true
      GOOGLE_IDP_ID: "C01881u7t"
      GOOGLE_IDP_SIGNING_CERT: ""
      GOOGLE_IDP_NAME_ID_FORMAT: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
      GOOGLE_IDP_CORE_ENTITY_ID: "https://sso.uds.dev/realms/uds"
      GOOGLE_IDP_ADMIN_GROUP: "uds-core-dev-admin"
      GOOGLE_IDP_AUDITOR_GROUP: "uds-core-dev-auditor"
