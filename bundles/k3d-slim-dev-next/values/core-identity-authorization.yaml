authservice:
  authservice:
    replicaCount: {{ .vars.authservice_replica_count }}

keycloak:
  keycloak:
    resources:
      requests:
        memory: "{{ .vars.keycloak_memory_request }}"
        cpu: "{{ .vars.keycloak_cpu_request }}"
      limits:
        memory: "{{ .vars.keycloak_memory_limit }}"
        cpu: "{{ .vars.keycloak_cpu_limit }}"
    waypoint:
      horizontalPodAutoscaler:
        enabled: {{ .vars.keycloak_waypoint_hpa_enabled }}
      deployment:
        requests:
          cpu: "{{ .vars.keycloak_waypoint_cpu_request }}"
          memory: "{{ .vars.keycloak_waypoint_memory_request }}"
{{- with index .vars "insecure_admin_password_generation" }}
    insecureAdminPasswordGeneration:
      enabled: {{ . }}
{{- end }}
{{- with index .vars "keycloak_ha" }}
    autoscaling:
      enabled: {{ . }}
{{- end }}
{{- $pgUsername := index .vars "keycloak_pg_username" }}
{{- $pgPassword := index .vars "keycloak_pg_password" }}
{{- $pgDatabase := index .vars "keycloak_pg_database" }}
{{- $pgHost := index .vars "keycloak_pg_host" }}
{{- if or $pgUsername $pgPassword $pgDatabase $pgHost }}
    postgresql:
{{- with $pgUsername }}
      username: "{{ . }}"
{{- end }}
{{- with $pgPassword }}
      password: {{ printf "%q" . }}
{{- end }}
{{- with $pgDatabase }}
      database: "{{ . }}"
{{- end }}
{{- with $pgHost }}
      host: "{{ . }}"
{{- end }}
{{- end }}
{{- with index .vars "keycloak_devmode" }}
    devMode: {{ . }}
{{- end }}
    realmInitEnv:
      FLEET_CLIENT_ENABLED: "true"
      GOOGLE_IDP_ENABLED: true
      GOOGLE_IDP_ID: "C01881u7t"
      GOOGLE_IDP_SIGNING_CERT: ""
      GOOGLE_IDP_NAME_ID_FORMAT: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"
      GOOGLE_IDP_CORE_ENTITY_ID: "https://sso.uds.dev/realms/uds"
      GOOGLE_IDP_ADMIN_GROUP: "uds-core-dev-admin"
      GOOGLE_IDP_AUDITOR_GROUP: "uds-core-dev-auditor"
